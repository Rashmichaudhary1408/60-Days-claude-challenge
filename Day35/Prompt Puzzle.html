<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🧩 Prompt Puzzle — Master AI Prompting Through Play</title>
<style>
:root{--bg:#0e0b1f;--card:#1a1536;--ink:#efeaff;--mut:#a79fcf;--ac:#7c5cff;--ac2:#22d3a6;--bad:#ff5c7a;--gold:#ffc857;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(circle at 20% 0,#2b1f66,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.w{max-width:920px;margin:0 auto;padding:18px}
.fade{animation:in .45s ease both}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:.2em 0}.g{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid #ffffff1a;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 10px 30px #0006}
.btn{border:0;border-radius:12px;padding:12px 22px;font:700 15px inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--ac),#5b8cff);cursor:pointer;box-shadow:0 6px 22px #7c5cff66;transition:.2s}
.btn:hover{transform:translateY(-2px) scale(1.02)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}.btn.s{background:#ffffff14;box-shadow:none}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pill{background:#ffffff12;border-radius:99px;padding:4px 12px;font-size:13px;color:var(--mut)}.pill b{color:var(--ink)}
.dots{display:flex;gap:6px;flex:1;min-width:140px}.dots i{flex:1;height:6px;border-radius:3px;background:#ffffff1f}.dots i.on{background:linear-gradient(90deg,var(--ac),var(--ac2))}.dots i.cur{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.badge{display:inline-block;background:#7c5cff33;color:#c9bbff;border-radius:8px;padding:2px 10px;font:700 12px inherit;letter-spacing:.06em;text-transform:uppercase}
.want{border-left:4px solid var(--ac2);background:#22d3a612;padding:10px 14px;border-radius:8px}
.slot{border:2px dashed #ffffff33;border-radius:12px;padding:10px 14px;margin:8px 0;min-height:52px;transition:.2s}.slot small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.slot:hover,.slot.over{border-color:var(--ac2);background:#22d3a60f}.slot.ok{border:2px solid var(--ac2);background:#22d3a61a;animation:pop .4s}
.blk,.chip{display:inline-block;margin:5px;padding:9px 13px;border-radius:10px;background:#2c2459;border:1px solid #ffffff22;cursor:grab;transition:.2s;user-select:none}
.blk:hover,.chip:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 6px 16px #7c5cff55}
.sel{outline:2px solid var(--gold)}.hint{animation:glow 1s infinite alternate}.shake{animation:sh .35s}
.chip{cursor:pointer}.chip.gone{opacity:.3;text-decoration:line-through;background:#4a1d33}
.opt{cursor:pointer;transition:.2s}.opt:hover{border-color:var(--ac);transform:translateY(-3px)}.opt.dis{opacity:.35;pointer-events:none;border-color:var(--bad)}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes glow{to{box-shadow:0 0 18px var(--gold);border-color:var(--gold)}}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{font:800 64px/1 system-ui;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.two{grid-template-columns:1fr}}
.out{background:#0b0818;border-radius:10px;padding:10px;font-size:14px;color:#cfc8f5;white-space:pre-wrap}
.bar{height:12px;background:#ffffff14;border-radius:6px;overflow:hidden;margin:3px 0 12px}.bar b{display:block;height:100%;width:0;border-radius:6px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;justify-content:space-between;font-size:14px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.st div{background:#ffffff0d;border-radius:10px;padding:8px;text-align:center;font-size:13px;color:var(--mut)}.st b{display:block;font-size:20px;color:var(--ink)}
#toasts{position:fixed;right:14px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:9;pointer-events:none}
.toast{background:#241d4d;border:1px solid var(--ac);padding:9px 14px;border-radius:10px;animation:in .3s ease,out .4s 2s forwards;box-shadow:0 8px 20px #0008}.toast.bad{border-color:var(--bad)}@keyframes out{to{opacity:0;transform:translateX(30px)}}
.c{text-align:center}
</style></head><body><div class="w" id="app"></div><div id="toasts"></div>
<script>
(function(){
var TR=["Role","Task","Context","Format","Constraint"],TK=["R","T","C","F","K"],COL=["#7c5cff","#5b8cff","#22d3a6","#ffc857","#ff5c7a"];
var SC=[
{t:"Sneaker launch email",d:"Three punchy email subject lines for a limited-edition sneaker drop.",b:["You are an email marketer for a streetwear brand.","Write 3 subject lines for our limited-edition sneaker launch.","The audience is sneaker fans aged 18-30 and the drop is Friday at 9am.","Format: a numbered list, each under 50 characters.","Use an exciting tone and avoid the word 'sale'."],x:["Be creative and think outside the box.","Make it the best email ever written.","Also write a poem about shoes."],w:"Write email subjects for shoes.",oe:"You are the world's greatest genius marketer with 40 years of experience. Think very deeply, be extremely creative, consider every possible angle, write many options, then rewrite them again and again, and make sure they are perfect, amazing and unforgettable for any shoe fan anywhere.",wo:"New shoes are available. Buy our shoes today. Great shoes for everyone.",oo:"1. Friday 9am: the drop you waited for\n2. Only 500 pairs. Don't blink.\n3. Your next grail lands Friday",p:"Specific roles, audiences and formats beat vague requests."},
{t:"Coffee shop caption",d:"A friendly Instagram caption announcing a new pumpkin latte.",b:["You are a social media manager for a cozy local coffee shop.","Write one Instagram caption announcing our new pumpkin spice latte.","Our followers are students and remote workers who love autumn vibes.","Format: 2 short sentences plus 3 hashtags.","Keep the tone warm and playful, with no more than one emoji."],x:["Write it like a viral influencer with millions of followers.","Use as many emojis as possible.","Mention every drink on our menu."],w:"Write a caption about our latte.",oe:"Act as an elite award-winning global social media strategist and copywriter. Analyse trends, psychology, algorithms and competitors in depth, then write ten captions, rank them, explain each, and refine each three times with hashtags, emojis and calls to action.",wo:"Try our latte. It is good. Come to our shop.",oo:"Fall just got cozier: our pumpkin spice latte is here. Grab one between classes or Zoom calls. 🍂\n#PumpkinLatte #CozyCafe #FallVibes",p:"Context about the audience shapes tone and word choice."},
{t:"Late delivery reply",d:"A calm, empathetic reply to a customer whose order arrived 5 days late.",b:["You are a customer support agent for an online store.","Reply to a customer whose order arrived 5 days late.","The customer is upset, and we can offer a 15% refund code.","Format: a short email of under 100 words with a greeting and sign-off.","Stay empathetic and avoid blaming the courier."],x:["Be as persuasive as possible.","Include our full return policy text.","Write in the style of Shakespeare."],w:"Reply to angry customer.",oe:"You are the most empathetic, brilliant, legally careful support expert on Earth. Consider every possible customer emotion, every policy, every outcome, write several drafts, compare them, and produce a flawless masterpiece response that solves all possible problems.",wo:"Sorry. Late things happen. Bye.",oo:"Hi Sam,\nI'm so sorry your order arrived five days late. That's frustrating. Here's code SORRY15 for 15% back. Thank you for your patience.\nWarm regards, Priya",p:"Clear constraints keep outputs safe, short and on-brand."},
{t:"Water bottle description",d:"A benefit-focused product description for an insulated water bottle.",b:["You are an e-commerce copywriter.","Write a product description for our insulated steel water bottle.","It keeps drinks cold for 24 hours and is aimed at hikers and gym-goers.","Format: one headline and three bullet points.","Focus on benefits, not technical jargon."],x:["Make it sound luxurious and exclusive.","Compare us to every competitor.","Write at least 1000 words."],w:"Describe a bottle.",oe:"You are a legendary copywriter with encyclopedic knowledge of materials science, psychology, SEO and persuasion. Write an exhaustive description covering every conceivable detail, perspective and use case, optimized for every platform and every buyer on Earth.",wo:"This is a bottle. You can put water in it.",oo:"Ice-cold for 24 hours\n• Stays chilled on the longest trail\n• Fits gym bags and cup holders\n• Tough steel that handles daily knocks",p:"Format instructions turn rambling text into usable copy."},
{t:"Fitness app headline",d:"Five short ad headlines for a beginner-friendly fitness app.",b:["You are a performance marketer writing paid social ads.","Write 5 headlines for a beginner-friendly fitness app.","The audience is busy adults who feel intimidated by gyms.","Format: a bulleted list, each headline under 8 words.","Be encouraging and never shame the reader."],x:["Make people feel bad so they sign up.","Use industry jargon to sound smart.","Add a long legal disclaimer."],w:"Write fitness ads.",oe:"Act as a combination of the top ten advertising legends in history. Deeply analyse human motivation, neuroscience and market data, produce dozens of headlines, test them mentally, rank them statistically, and deliver only the perfect set.",wo:"Get fit now! Fitness is good. Download our app.",oo:"• Start small. Feel strong.\n• Workouts that fit your day\n• No gym? No problem.\n• Your pace, your plan\n• Ten minutes counts",p:"Tone constraints protect brand voice."},
{t:"Product launch tweet",d:"A short launch post announcing a new task-management app.",b:["You are a startup social media lead.","Write a launch post announcing our new task-management app, TaskNest.","Readers are freelancers who struggle to track deadlines.","Format: under 240 characters with one call to action.","Use a confident tone and no buzzwords."],x:["Hype it as revolutionary and game-changing.","Include our entire feature list.","Tag every famous founder."],w:"Tweet about my app.",oe:"You are a world-class growth hacker and viral expert. Think about every platform, algorithm and audience segment, then craft twenty tweets with different angles, rewrite them repeatedly for virality, and select the one that guarantees a million views.",wo:"We made an app. It's new. Check it out.",oo:"Missed deadlines are over. TaskNest keeps freelancers on track with simple reminders and one clean board. Try it free today.",p:"Naming the product and the reader's pain gives AI something real to write about."}];
SC.forEach(function(s){s.o=s.b.join(" ")});
function sh(a){a=a.slice();for(var i=a.length;i>1;){var j=Math.floor(Math.random()*i--),t=a[i];a[i]=a[j];a[j]=t}return a}
var app=document.getElementById("app"),G,C,tmr;
var TY=["Build the Prompt","Clean the Prompt","Choose the Best Prompt"];
function set(h){clearInterval(tmr);app.innerHTML='<div class="fade">'+h+'</div>';window.scrollTo(0,0)}
function toast(m,b){var d=document.createElement("div");d.className="toast"+(b?" bad":"");d.textContent=m;document.getElementById("toasts").appendChild(d);setTimeout(function(){d.remove()},2500)}
function cnt(){document.querySelectorAll("[data-cnt]").forEach(function(e){var to=+e.dataset.cnt,t0=performance.now();(function f(n){var p=Math.min(1,(n-t0)/1100);e.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)});setTimeout(function(){document.querySelectorAll(".bar b").forEach(function(b){b.style.width=b.dataset.w+"%"})},60)}
function intro(){G={o:sh(SC),ty:sh([0,1,2,0,1,2]),i:0,res:[],T:{R:[0,0],T:[0,0],C:[0,0],F:[0,0],K:[0,0]}};
set('<div class="c" style="padding:30px 0"><div class="badge">Domain: Marketing &amp; Sales · Beginner</div><h1 class="g" style="font-size:clamp(34px,8vw,60px)">🧩 Prompt Puzzle</h1><p style="color:var(--mut)">Master AI prompting through play. 6 scenarios, 3 challenge types, live scoring.</p><div class="card" style="text-align:left"><b>Challenges</b><p>🧱 <b>Build</b> a prompt from blocks · 🧹 <b>Clean</b> out the noise · 🏆 <b>Choose</b> the best prompt</p></div><button class="btn" data-a="go">Start Puzzle ▸</button></div>')}
function level(){var s=G.o[G.i],ty=G.ty[G.i],L=sh(s.b.map(function(x,k){return{x:x,s:k}}).concat(s.x.map(function(x){return{x:x,s:-1}})));L.forEach(function(l,k){l.id=k});
C={s:s,ty:ty,L:L,pl:[null,null,null,null,null],sel:null,hint:null,rm:{},w:0,h:0,m:0,t0:Date.now(),dis:{},opts:sh([{x:s.w,k:"w"},{x:s.o,k:"o"},{x:s.oe,k:"e"}])};draw()}
function draw(){var s=C.s,h='<div class="top"><div class="dots">'+G.o.map(function(_,i){return'<i class="'+(i<G.i?"on":i==G.i?"cur":"")+'"></i>'}).join("")+'</div><span class="pill">⏱ <b id="tm">'+Math.round((Date.now()-C.t0)/1000)+'s</b></span><span class="pill">Moves <b>'+C.m+'</b></span><span class="pill">Wrong <b>'+C.w+'</b></span><span class="pill">Hints <b>'+C.h+'</b></span></div><span class="badge">'+(G.i+1)+'/6 · '+TY[C.ty]+'</span><h2>'+s.t+'</h2><div class="want">🎯 <b>Desired output:</b> '+s.d+'</div>';
if(C.ty==0){h+='<p style="color:var(--mut)">Drag (or tap a block, then tap a slot) to build the prompt. Beware of distractors.</p>';for(var i=0;i<5;i++){var p=C.pl[i];h+='<div class="slot'+(p!=null?" ok":"")+'" data-sl="'+i+'"><small>'+TR[i]+'</small>'+(p!=null?C.L[p].x:"Drop a block here")+'</div>'}
h+='<div>'+C.L.filter(function(l){return C.pl.indexOf(l.id)<0}).map(function(l){return'<div class="blk'+(C.sel===l.id?" sel":"")+(C.hint===l.id?" hint":"")+'" draggable="true" data-b="'+l.id+'">'+l.x+'</div>'}).join("")+'</div>'}
else if(C.ty==1){h+='<p style="color:var(--mut)">Tap the lines that add noise to remove them. Keep what the AI truly needs.</p><div class="card">'+C.L.map(function(l){return'<span class="chip'+(C.rm[l.id]?" gone":"")+(C.hint===l.id?" hint":"")+'" data-c="'+l.id+'">'+l.x+'</span>'}).join("")+'</div><button class="btn" data-a="sub">Submit cleaned prompt</button> '}
else{h+='<p style="color:var(--mut)">Which prompt will get the best result?</p>'+C.opts.map(function(o,i){return'<div class="card opt'+(C.dis[i]?" dis":"")+'" data-o="'+i+'">'+o.x+'</div>'}).join("")}
h+=' <button class="btn s" data-a="hint">💡 Hint (-6)</button>';set(h);tmr=setInterval(function(){var e=document.getElementById("tm");if(e)e.textContent=Math.round((Date.now()-C.t0)/1000)+"s"},1000)}
function place(id,sl){if(C.pl[sl]!=null)return;var l=C.L[id];C.m++;C.sel=null;C.hint=null;
if(l.s==sl){C.pl[sl]=id;G.T[TK[sl]][0]++;toast("✅ "+TR[sl]+" locked in!");if(C.pl.every(function(x){return x!=null}))return fin(5/(5+C.w))}
else{C.w++;G.T[TK[l.s>=0?l.s:sl]][1]++;toast(l.s<0?"❌ That block is noise":"❌ Wrong slot: that's a "+TR[l.s]+" block",1)}draw()}
function fin(acc){var t=Math.round((Date.now()-C.t0)/1000),b=(C.w==0&&C.h==0)?8:0,sc=Math.max(0,Math.min(100,Math.round(acc*100-C.w*3-C.h*6-Math.max(0,t-60)/4+b)));G.res.push({sc:sc,acc:acc,t:t,m:C.m,w:C.w,h:C.h,b:b,s:C.s});result()}
function result(){var r=G.res[G.i],s=C.s;set('<div class="card c"><div class="g big" data-cnt="'+r.sc+'">0</div><div style="color:var(--mut)">points this round</div></div><div class="st"><div><b>'+Math.round(r.acc*100)+'%</b>Accuracy</div><div><b>'+r.t+'s</b>Time</div><div><b>'+r.m+'</b>Moves</div><div><b>'+r.w+'</b>Wrong</div><div><b>'+r.h+'</b>Hints</div><div><b>+'+r.b+'</b>Optimization bonus</div></div><div class="two"><div class="card"><span class="badge" style="color:#ff9bb0">Weak prompt</span><p>'+s.w+'</p><div class="out">'+s.wo+'</div></div><div class="card"><span class="badge" style="color:#6ff0c8">Optimized prompt</span><p>'+s.o+'</p><div class="out">'+s.oo+'</div></div></div><div class="card"><span class="badge" style="color:var(--gold)">Over-engineered</span><p style="color:var(--mut)">'+s.oe+'</p><small>Long is not better. It hides the real task.</small></div><div class="card want">💡 <b>Principle:</b> '+s.p+'</div><p class="c"><button class="btn" data-a="next">'+(G.i<5?"Next scenario ▸":"See my report ▸")+'</button></p>');cnt()}
function report(){var R=G.res,tot=Math.round(R.reduce(function(a,r){return a+r.sc},0)/R.length),rt=tot>=90?"Prompt Architect":tot>=75?"Prompt Crafter":tot>=55?"Prompt Apprentice":"Prompt Rookie",rk=tot>=90?"🥇 Gold League":tot>=75?"🥈 Silver League":"🥉 Bronze League",nx=tot>=90?"Try a harder difficulty to stay challenged.":"Reach "+(tot>=75?90:tot>=55?75:55)+" to become "+(tot>=75?"Prompt Architect":tot>=55?"Prompt Crafter":"Prompt Apprentice")+".";
var pc={},wk="R",wv=101,tips={R:"Start prompts by giving the AI a clear role.",T:"State one specific task with a clear verb and quantity.",C:"Add context: audience, product and goal.",F:"Spell out the format and length you want.",K:"Add constraints like tone and things to avoid, but skip the fluff."};
TK.forEach(function(k){var a=G.T[k];pc[k]=Math.round(100*(a[0]+1)/(a[0]+a[1]+1));if(pc[k]<wv){wv=pc[k];wk=k}});
var best=R.slice().sort(function(a,b){return a.sc-b.sc})[0].s,sum=function(k){return R.reduce(function(a,r){return a+r[k]},0)};
set('<div class="card c"><div class="badge">Prompt Performance Report</div><div class="g big" data-cnt="'+tot+'">0</div><h2>'+rt+'</h2><div style="color:var(--mut)">'+rk+'</div></div><div class="st"><div><b>'+Math.round(100*R.reduce(function(a,r){return a+r.acc},0)/R.length)+'%</b>Accuracy</div><div><b>'+sum("t")+'s</b>Total time</div><div><b>'+sum("m")+'</b>Moves</div><div><b>'+sum("w")+'</b>Wrong</div><div><b>'+sum("h")+'</b>Hints</div><div><b>+'+sum("b")+'</b>Bonus</div></div><div class="card"><h3>🧬 Prompt DNA</h3>'+TK.map(function(k,i){return'<div class="row"><span>'+TR[i]+'</span><span>'+pc[k]+'%</span></div><div class="bar"><b data-w="'+pc[k]+'" style="background:'+COL[i]+'"></b></div>'}).join("")+'</div><div class="card"><h3>Feedback</h3><p>Your strongest habit is solid structure. Your weakest strand is <b>'+TR[TK.indexOf(wk)]+'</b> ('+wv+'%). '+tips[wk]+'</p><p>🎯 <b>Next milestone:</b> '+nx+'</p></div><div class="card"><h3>✨ Final optimized prompt</h3><div class="out" id="fp">'+best.o+'</div><p><button class="btn s" data-a="copy">Copy prompt</button></p></div><p class="c"><button class="btn" data-a="re">Replay with new scenarios ↻</button></p>');cnt()}
app.addEventListener("click",function(e){var t=e.target.closest("[data-a],[data-b],[data-sl],[data-c],[data-o]");if(!t)return;var d=t.dataset;
if(d.a=="go"||d.a=="re")return(d.a=="re"?intro():0)||(d.a=="go"&&(level()));
if(d.a=="next"){G.i++;return G.i<6?level():report()}
if(d.a=="copy"){try{navigator.clipboard.writeText(document.getElementById("fp").textContent);toast("Copied!")}catch(x){toast("Select and copy manually",1)}return}
if(d.a=="hint"){C.h++;if(C.ty==0){var n=C.L.filter(function(l){return l.s>=0&&C.pl.indexOf(l.id)<0})[0];if(n)C.hint=n.id}else if(C.ty==1){var z=C.L.filter(function(l){return l.s<0&&!C.rm[l.id]})[0];if(z)C.hint=z.id}else{var k=C.opts.findIndex(function(o,i){return o.k!="o"&&!C.dis[i]});if(k>=0){C.dis[k]=1}}toast("💡 Hint used");return draw()}
if(d.b!=null){C.sel=+d.b;return draw()}
if(d.sl!=null){if(C.sel!=null)place(C.sel,+d.sl);else toast("Pick a block first",1);return}
if(d.c!=null){C.rm[d.c]=!C.rm[d.c];C.m++;return draw()}
if(d.a=="sub"){var g=0;C.L.forEach(function(l){var ok=(l.s<0)==!!C.rm[l.id];if(ok)g++;else C.w++;if(l.s>=0)G.T[TK[l.s]][ok?0:1]++;});return fin(g/C.L.length)}
if(d.o!=null){var o=C.opts[+d.o];C.m++;if(o.k=="o"){G.T.T[0]++;G.T.C[0]++;G.T.K[0]++;return fin(1/(1+C.w))}C.w++;C.dis[d.o]=1;G.T[o.k=="w"?"C":"K"][1]++;toast(o.k=="w"?"❌ Too vague":"❌ Too bloated",1);draw()}});
app.addEventListener("dragstart",function(e){var b=e.target.closest("[data-b]");if(b){e.dataTransfer.setData("text",b.dataset.b);C.sel=null}});
app.addEventListener("dragover",function(e){var s=e.target.closest("[data-sl]");if(s){e.preventDefault();s.classList.add("over")}});
app.addEventListener("dragleave",function(e){var s=e.target.closest("[data-sl]");if(s)s.classList.remove("over")});
app.addEventListener("drop",function(e){var s=e.target.closest("[data-sl]");if(s){e.preventDefault();var v=e.dataTransfer.getData("text");if(v!=="")place(+v,+s.dataset.sl)}});
intro();
})();
</script></body></html>
