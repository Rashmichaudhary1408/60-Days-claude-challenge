<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typing Speed Studio</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s}

button,select,textarea{font:inherit;color:inherit}
button{background:var(--p);border:1px solid transparent;border-radius:10px;padding:7px 14px;cursor:pointer;transition:.18s}

:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin:18px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

ul{margin:6px 0;padding-left:18px}li{margin:3px 0}

table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 8px;text-align:left;border-bottom:1px solid var(--p2)}
label{display:flex;gap:10px;align-items:center;margin:10px 0;justify-content:space-between}
@media(max-width:600px){#box{padding:16px}.big div b{font-size:40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fade{animation:fi .4s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}}

if(acc<92)tip.push('Slow down 10-15%. Accuracy builds speed more reliably than rushing.');if(cons<65)tip.push('Aim for a steady rhythm; avoid pausing before long, technical words.');if(weak.length)tip.push('Drill words containing '+weak.slice(0,3).map(w=>'"'+(w[0]==' '?'space':w[0])+'"').join(', ')+'.');if(wpm<35)tip.push('Keep eyes on the text, not the keyboard, and use all ten fingers.');if(!tip.length)tip.push('Try Adaptive mode or longer sessions to push your limits.');
const rows=['qwertyuiop','asdfghjkl','zxcvbnm'].map(r=>`<div class="kr">${[...r].map(k=>`<b title="${T.errs[k]||0} errors" style="background:color-mix(in srgb,var(--bad) ${Math.round((T.errs[k]||0)/mx*85)}%,var(--p2))">${k}</b>`).join('')}</div>`).join('');
const errPts=T.smp.map((s,i)=>s.e?i:-1).filter(i=>i>=0),z=S.mode=='zen';
const R=$('#res');R.className='fade';R.innerHTML=`<div class="card"><div class="big"><div><b>${Math.round(wpm)}</b><span>WPM</span></div><div><b>${acc.toFixed(1)}%</b><span>Accuracy</span></div><div class="s"><b>${Math.round(raw)}</b><span>Raw WPM</span></div><div class="s"><b>${cons}%</b><span>Consistency</span></div><div class="s"><b>${comp}%</b><span>Complete</span></div><div class="s"><b>${Math.round(el)}s</b><span>Duration</span></div></div>
<p style="color:var(--mut)">${label} &middot; faster than about <b style="color:var(--acc)">${pct}%</b> of typists (estimate based on a ~40 WPM average) &middot; PB: ${(pb[label]||0)} WPM</p><div>${bad.map(x=>`<span class="badge ${x[1]?'n':''}">${x[0]}</span>`).join('')}</div></div>
<div class="grid"><div class="card"><h3>WPM progress <span style="color:var(--acc)">&#9632; net</span> <span>&#9632; raw</span></h3>${chart([{d:T.smp.map(s=>s.wpm),c:'var(--acc)',pts:errPts},{d:T.smp.map(s=>s.raw),c:'var(--mut)',dash:1}])}</div>
<div class="card"><h3>Accuracy over time</h3>${chart([{d:T.smp.map(s=>s.acc),c:'var(--ok)'}],100)}</div></div>
<div class="grid"><div class="card"><h3>Characters</h3><p style="font-size:18px;margin:0"><b style="color:var(--acc)">${T.kc}</b> correct &middot; <b style="color:var(--bad)">${wrong}</b> incorrect &middot; <b>${extra}</b> extra &middot; <b>${missed}</b> missed</p><p style="color:var(--mut)">Mistakes: ${T.kw} &middot; Best streak: ${T.best} &middot; Total keystrokes: ${T.kt}</p></div>
<div class="card"><h3>Typing rhythm</h3>${chart([{d:T.smp.map(s=>s.b),c:'var(--acc)'}])}<p style="color:var(--mut);margin:4px 0 0">Avg key interval ${Math.round(ivm)} ms</p></div></div>
<div class="grid"><div class="card"><h3>Error heatmap</h3>${rows}<p style="color:var(--mut);text-align:center;margin:6px 0 0">${weak.length?'Most mistyped: '+weak.map(w=>(w[0]==' '?'space':w[0])+' ('+w[1]+')').join(', '):'No mistakes. Perfect run!'}</p></div>
<div class="card"><h3>Performance summary</h3><b>Strengths</b><ul>${str.map(s=>'<li>'+s+'</li>').join('')||'<li>Keep practising</li>'}</ul><b>Weaknesses</b><ul>${wk.map(s=>'<li>'+s+'</li>').join('')||'<li>None detected</li>'}</ul><b>Suggestions</b><ul>${tip.map(s=>'<li>'+s+'</li>').join('')}</ul></div></div>
<div class="row"><button class="on" id="rNew">Next test (Enter)</button><button id="rSame">Repeat this text</button></div>`;

$('#box').hidden=true;$('#bar').hidden=true;$('#hint').hidden=true;R.hidden=false;R.scrollIntoView({behavior:'smooth'});$('#rNew').focus()}
