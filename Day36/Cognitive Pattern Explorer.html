<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cognitive Pattern Explorer</title>
<style>
:root{--bg:#f3f6f8;--card:#ffffff;--tx:#1f2d3a;--mut:#5d6b78;--ac:#4f8f8b;--ac2:#8aa9d6;--bd:#d8e1e8;--orb1:#bfe3dc;--orb2:#cfd9f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b22;--card:#1b2731;--tx:#e6eef4;--mut:#9fb0be;--ac:#6fb3ad;--ac2:#7f9fd0;--bd:#2c3b48;--orb1:#1f4a48;--orb2:#26365a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121b22;--card:#1b2731;--tx:#e6eef4;--mut:#9fb0be;--ac:#6fb3ad;--ac2:#7f9fd0;--bd:#2c3b48;--orb1:#1f4a48;--orb2:#26365a;color-scheme:dark}
body.stress{--ac:#c27a5a;--ac2:#b9806f;--orb1:#f0cdb9;--orb2:#e9c0c0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.stress{--orb1:#5a3524;--orb2:#552b31}}
:root[data-theme="dark"] body.stress{--orb1:#5a3524;--orb2:#552b31}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .6s}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.7;z-index:0;pointer-events:none;animation:float 16s ease-in-out infinite}
.o1{width:340px;height:340px;background:var(--orb1);top:-80px;left:-80px}
.o2{width:300px;height:300px;background:var(--orb2);bottom:-60px;right:-60px;animation-delay:-6s}
body.stress .orb{animation-duration:6s}
@keyframes float{50%{transform:translate(40px,30px) scale(1.12)}}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
h1{font-size:1.05rem;margin:0;letter-spacing:.04em;font-weight:600}
#prog{display:flex;gap:6px;margin:10px 0 18px}
#prog div{flex:1;height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s}
#plabel{font-size:.8rem;color:var(--mut);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.06);animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h2{margin:0 0 6px;font-size:1.4rem;font-weight:600}
p{margin:8px 0}.mut{color:var(--mut)}
.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;transition:transform .2s,filter .2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
@media(max-width:480px){.modes{grid-template-columns:1fr}}
.mode{font:inherit;color:var(--tx);text-align:left;background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .2s,transform .2s}
.mode:hover,.mode[aria-pressed="true"]{border-color:var(--ac);transform:translateY(-2px)}
.mode b{display:block}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{font:inherit;color:var(--tx);text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;transition:all .2s}
.opt:hover{border-color:var(--ac);transform:translateX(4px)}
.pressure{font-size:.85rem;color:var(--ac);border-left:3px solid var(--ac);padding-left:10px;margin:10px 0}
ul.sort{list-style:none;margin:14px 0;padding:0;display:grid;gap:10px;counter-reset:n}
ul.sort li{counter-increment:n;display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:grab;touch-action:none;user-select:none;transition:box-shadow .2s,border-color .2s}
ul.sort li:before{content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:.85rem}
ul.sort li.drag{opacity:.5}
ul.sort li.grab{border-color:var(--ac2);box-shadow:0 0 0 3px var(--ac2)}
.tl{border-left:3px dashed var(--bd);margin-left:6px;padding-left:10px}
.bar{margin:10px 0}.bar .t{display:flex;justify-content:space-between;font-size:.92rem}
.bar .tr{height:12px;background:var(--bd);border-radius:8px;overflow:hidden;margin-top:4px}
.bar .f{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1s}
textarea{width:100%;min-height:90px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.note{font-size:.8rem;color:var(--mut);margin-top:16px}
.sr{position:absolute;left:-9999px}
table{width:100%;border-collapse:collapse;font-size:.85rem;display:block;overflow-x:auto}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<main>
<header><h1>Cognitive Pattern Explorer</h1><button class="btn ghost" id="restart" hidden>Restart</button></header>
<div id="plabel" aria-live="polite"></div>
<div id="prog" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100"><div><i></i></div><div><i></i></div><div><i></i></div><div><i></i></div></div>
<section id="app" tabindex="-1"></section>
<div class="sr" id="live" aria-live="assertive"></div>
</main>
<script>
"use strict";
const T={A:"Analytical Thinker",E:"Emotional Intuitive",O:"Overthinking Loop Style",F:"Action-First Decision Maker",B:"Balanced Reflective Thinker"};
const KEYS=Object.keys(T);
const INSIGHT={
A:"You often look for structure, facts and clear criteria. This suggests you feel steadier when a situation is broken into parts. It may help to also check in with how a choice feels.",
E:"You often tune in to feelings, tone and the people involved. This suggests your gut sense carries real information for you. It may help to pair it with a few concrete facts now and then.",
O:"You often return to a situation again and again, searching for the perfect angle. This suggests you care about getting things right. Setting a gentle ‘good enough’ point can make room for rest.",
F:"You often move quickly and learn by doing. This suggests momentum energizes you. A short pause before committing might occasionally reveal something worth knowing.",
B:"You often blend feeling, thinking and action, pausing before you move. This suggests flexibility. Notice whether balance ever turns into hesitation, and when it serves you well."};
const DATA={
ch1:[
{q:"A plan you made falls through an hour before it starts.",o:[["A","List what changed and pick the best alternative."],["E","Notice my disappointment and check in with the others."],["O","Replay what I could have done differently."],["F","Improvise something right away."],["B","Pause, feel the surprise, then choose a simple next step."]]},
{q:"Someone you respect gives you ambiguous feedback.",o:[["A","Ask for specifics so I can analyze it."],["E","Sense the tone behind the words."],["O","Reread it several times for hidden meanings."],["F","Pick one thing to change and do it today."],["B","Take a day, then talk it through."]]},
{q:"You must choose between two appealing opportunities.",o:[["A","Build a comparison of pros and cons."],["E","See which one I picture myself excited about."],["O","Keep researching until I feel certain."],["F","Pick one and adjust as I go."],["B","Mix a gut check with a few facts."]]},
{q:"A friend shares a problem with you.",o:[["A","Help them break it into parts."],["E","Listen and reflect their feelings."],["O","Think about it long after we talk."],["F","Suggest a concrete step right now."],["B","Listen first, then offer options."]]}],
stress:["Time feels tight and your attention is pulled in several directions.","Your energy is low and there are many open tasks.","Others are waiting on you and the clock is ticking.","You are carrying a lot already today."],
ch2:{title:"Choose Your Priorities",desc:"Drag the cards so what matters most to you in a tough decision sits at the top.",items:[["A","Weighing the facts"],["E","Honoring how it feels"],["O","Getting it just right"],["F","Moving forward now"],["B","Seeing the bigger picture"]]},
ch3:[{title:"Map Your Thinking: A Surprise Problem",desc:"Drag the steps into the order your mind usually follows, first at the top.",items:[["A","Gather the details"],["E","Notice my emotional reaction"],["O","Run through every ‘what if’"],["F","Try something immediately"],["B","Pause and zoom out"]]},
{title:"Map Your Thinking: A Big Decision",desc:"Arrange this timeline in the order you tend to move through it.",items:[["F","Take a first step"],["B","Check in with body and mind"],["A","Compare options on paper"],["O","Revisit the choice again"],["E","Ask what feels right"]]}]};

const S={mode:"calm",ch:0,i:0,sc:[{},{},{}]};
const $=s=>document.querySelector(s);
const app=$("#app");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function say(t){$("#live").textContent=t}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function add(ch,k,n){S.sc[ch][k]=(S.sc[ch][k]||0)+n}
function show(html,focus){app.innerHTML=html;if(focus!==false)app.focus({preventScroll:true});scrollTo({top:0,behavior:reduce?"auto":"smooth"})}
function progress(label,frac){
 const bars=document.querySelectorAll("#prog i");
 bars.forEach((b,i)=>{b.style.width=Math.max(0,Math.min(1,frac-i))*100+"%"});
 $("#prog").setAttribute("aria-valuenow",Math.round(frac/4*100));
 $("#plabel").textContent=label;$("#restart").hidden=false;
}

/* Reusable sortable: native drag, touch fallback, keyboard */
function sortable(ul,items){
 ul.innerHTML=items.map((it,i)=>`<li tabindex="0" draggable="true" data-k="${it[0]}" aria-label="${esc(it[1])}. Press space to grab, arrow keys to move.">${esc(it[1])}</li>`).join("");
 let drag=null;
 const lis=()=>[...ul.children];
 const place=(el,over,y)=>{if(!over||over===el)return;const r=over.getBoundingClientRect();ul.insertBefore(el,y<r.top+r.height/2?over:over.nextSibling)};
 ul.addEventListener("dragstart",e=>{drag=e.target.closest("li");if(!drag)return;drag.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain","x")});
 ul.addEventListener("dragover",e=>{if(!drag)return;e.preventDefault();place(drag,e.target.closest("li"),e.clientY)});
 ul.addEventListener("dragend",()=>{if(drag)drag.classList.remove("drag");drag=null});
 let t=null;
 ul.addEventListener("touchstart",e=>{t=e.target.closest("li");if(t)t.classList.add("drag")},{passive:true});
 ul.addEventListener("touchmove",e=>{if(!t)return;e.preventDefault();const p=e.touches[0];const el=document.elementFromPoint(p.clientX,p.clientY);const o=el&&el.closest("li");if(o&&o.parentNode===ul)place(t,o,p.clientY)},{passive:false});
 const endT=()=>{if(t)t.classList.remove("drag");t=null};
 ul.addEventListener("touchend",endT);ul.addEventListener("touchcancel",endT);
 ul.addEventListener("keydown",e=>{
  const li=e.target.closest("li");if(!li)return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();li.classList.toggle("grab");say(li.classList.contains("grab")?"Grabbed":"Dropped, position "+(lis().indexOf(li)+1));return}
  if(e.key==="ArrowUp"||e.key==="ArrowDown"){
   e.preventDefault();const up=e.key==="ArrowUp",a=lis(),i=a.indexOf(li);
   if(li.classList.contains("grab")){
    if(up&&i>0)ul.insertBefore(li,a[i-1]);else if(!up&&i<a.length-1)ul.insertBefore(a[i+1],li);
    li.focus();say("Position "+(lis().indexOf(li)+1)+" of "+a.length);
   }else{const n=a[i+(up?-1:1)];if(n)n.focus()}
  }});
 return ()=>lis().map(l=>l.dataset.k);
}
/* position weights: first = n-1 ... last = 0 */
function scoreOrder(ch,order){order.forEach((k,i)=>add(ch,k,order.length-1-i))}

function start(){
 document.body.classList.toggle("stress",S.mode==="stress");
 progress("Welcome",0);
 show(`<div class="card"><h2>Welcome, explorer</h2>
 <p class="mut">A gentle, game-like journey through the ways you tend to think. There are no right answers and nothing here is a test.</p>
 <p>Choose the mood of your journey:</p>
 <div class="modes" role="group" aria-label="Mode">
 <button class="mode" data-m="calm" aria-pressed="${S.mode==="calm"}"><b>Calm Mode</b><span class="mut">A relaxed day, plenty of space to think.</span></button>
 <button class="mode" data-m="stress" aria-pressed="${S.mode==="stress"}"><b>Stress Mode</b><span class="mut">Imagine pressure in the background and answer from there.</span></button></div>
 <div class="row"><button class="btn" id="go">Begin Chapter 1</button></div>
 <p class="note">Educational and reflective only. This is not a diagnosis or a clinical assessment of any kind.</p></div>`);
 app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;document.body.classList.toggle("stress",S.mode==="stress");app.querySelectorAll(".mode").forEach(x=>x.setAttribute("aria-pressed",x===b))});
 $("#go").onclick=()=>{S.sc=[{},{},{}];S.i=0;chapter1()};
}

function chapter1(){
 const d=DATA.ch1,i=S.i;
 if(i>=d.length)return chapter2();
 progress("Chapter 1 · Discover Your Thinking Style · "+(i+1)+"/"+d.length,i/d.length);
 const s=d[i];
 show(`<div class="card"><h2>Chapter 1 · Scenario ${i+1}</h2>
 ${S.mode==="stress"?`<div class="pressure">${esc(DATA.stress[i%DATA.stress.length])}</div>`:""}
 <p>${esc(s.q)}</p><p class="mut">What feels most like you?</p>
 <div class="opts">${s.o.map((o,j)=>`<button class="opt" data-k="${o[0]}">${esc(o[1])}</button>`).join("")}</div></div>`);
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{add(0,b.dataset.k,3);S.i++;chapter1()});
}

function sortChapter(ch,title,desc,items,frac,label,next,btn){
 progress(label,frac);
 const shuffled=items.slice().sort(()=>Math.random()-.5);
 show(`<div class="card"><h2>${esc(title)}</h2>
 ${S.mode==="stress"?`<div class="pressure">${esc(DATA.stress[(ch+1)%DATA.stress.length])}</div>`:""}
 <p class="mut">${esc(desc)}</p><p class="note" style="margin-top:0">Drag, touch-drag, or focus a card, press Space, then use the arrow keys.</p>
 <ul class="sort ${ch===2?"tl":""}" id="sl" role="list"></ul>
 <div class="row"><button class="btn" id="nx">${btn}</button></div></div>`);
 const get=sortable($("#sl"),shuffled);
 $("#nx").onclick=()=>{scoreOrder(ch,get());next()};
}

function chapter2(){
 const c=DATA.ch2;
 sortChapter(1,"Chapter 2 · "+c.title,c.desc,c.items,1,"Chapter 2 · Choose Your Priorities",()=>{S.i=0;chapter3()},"Continue to Chapter 3");
}
function chapter3(){
 const i=S.i,d=DATA.ch3;
 if(i>=d.length)return journal();
 const last=i===d.length-1;
 sortChapter(2,"Chapter 3 · "+d[i].title,d[i].desc,d[i].items,2+i/d.length,"Chapter 3 · Map Your Thinking · "+(i+1)+"/"+d.length,()=>{S.i++;chapter3()},last?"Open my Reflection Journal":"Next timeline");
}

function pct(sc){
 const tot=KEYS.reduce((a,k)=>a+(sc[k]||0),0)||1;
 const o={};KEYS.forEach(k=>o[k]=(sc[k]||0)/tot*100);return o;
}
function overall(){
 const per=S.sc.map(pct),o={};
 KEYS.forEach(k=>o[k]=per.reduce((a,p)=>a+p[k],0)/per.length);
 return {o,per};
}
function journal(){
 progress("Reflection Journal",4);
 const {o,per}=overall();
 const rank=KEYS.slice().sort((a,b)=>o[b]-o[a]);
 const top=rank[0],second=rank[1];
 const spread=o[top]-o[rank[4]];
 const lead=o[top]-o[second]<6?`Your answers show a blend of <b>${T[top]}</b> and <b>${T[second]}</b> tendencies.`:`Across your answers, <b>${T[top]}</b> appeared most often.`;
 const other=S.mode==="calm"?"Stress":"Calm";
 show(`<div class="card"><h2>Your Reflection Journal</h2>
 <p class="mut">${S.mode==="calm"?"Calm":"Stress"} Mode · a snapshot of how you chose today, not a label.</p>
 <p>${lead} ${spread<15?"Your profile looks fairly even, which suggests you draw on several styles.":""}</p>
 <p>${INSIGHT[top]}</p><p>${INSIGHT[second]}</p>
 <h3>Percentage breakdown</h3>
 ${rank.map(k=>`<div class="bar"><div class="t"><span>${T[k]}</span><span>${o[k].toFixed(0)}%</span></div><div class="tr"><div class="f" data-w="${o[k].toFixed(1)}"></div></div></div>`).join("")}
 <h3>Across chapters</h3>
 <table><tr><th>Chapter</th>${KEYS.map(k=>`<th>${T[k].split(" ")[0]}</th>`).join("")}</tr>
 ${["1 · Style","2 · Priorities","3 · Timelines"].map((n,i)=>`<tr><td>${n}</td>${KEYS.map(k=>`<td>${per[i][k].toFixed(0)}%</td>`).join("")}</tr>`).join("")}</table>
 <p class="mut">Where chapters differ, it may hint that your style shifts between choosing, prioritizing and sequencing.</p>
 <h3>Your notes</h3>
 <label for="jn" class="mut">What stood out to you? What would you like to try differently?</label>
 <textarea id="jn" placeholder="Write freely; nothing is saved or sent anywhere."></textarea>
 <div class="row"><button class="btn" id="rp">Replay in ${other} Mode</button><button class="btn ghost" id="rs">Back to start</button></div>
 <p class="note">For self-reflection and education only. This is not a diagnosis, therapy, or a clinical assessment. If you are struggling, consider speaking with a qualified professional.</p></div>`);
 requestAnimationFrame(()=>setTimeout(()=>app.querySelectorAll(".f").forEach(f=>f.style.width=f.dataset.w+"%"),50));
 $("#rp").onclick=()=>{S.mode=S.mode==="calm"?"stress":"calm";document.body.classList.toggle("stress",S.mode==="stress");S.sc=[{},{},{}];S.i=0;chapter1()};
 $("#rs").onclick=start;
}

$("#restart").onclick=()=>{S.sc=[{},{},{}];S.i=0;start()};
start();
</script>
</body>
</html>
