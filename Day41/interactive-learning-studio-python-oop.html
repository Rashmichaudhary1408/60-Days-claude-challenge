<header>

<script>
const $=s=>document.querySelector(s);
const box=(c,t,b)=>`<div class="card ${c}"><b>${t}</b>${b}</div>`;
const code=c=>`<pre><code>${c}</code></pre>`;
const reveal=(t,b)=>`<details><summary>${t}</summary>${b}</details>`;

/* ---------- MODULES ---------- */
const MODS=[
{t:"Classes and Objects",sub:"Foundation",time:"25 min",
 body:`
 <p>Object-oriented programming (OOP) organizes a program around <b>objects</b>: bundles of data (<em>attributes</em>) and behavior (<em>methods</em>). A <b>class</b> is the definition that says what every object of that kind has and can do.</p>
 ${box("note","Analogy: blueprint and houses","<p>A class is an architect's blueprint. It is not a house; you cannot live in it. Each call like <code>Dog(\"Rex\")</code> builds one house (an <b>instance</b>) from the blueprint. Two houses share a design but have different owners, paint, and furniture.</p>")}
 <h3>Your first class</h3>
 ${code(`class Dog:
    count = 0                      # class attribute: shared by all dogs

    def __init__(self, name, age): # runs when you call Dog(...)
        self.name = name           # instance attributes: one set per dog
        self.age = age
        Dog.count += 1

    def speak(self):
        return f"{self.name} says Woof!"

    def __repr__(self):            # what you see when you print the object
        return f"Dog({self.name!r}, {self.age})"

rex = Dog("Rex", 3)
luna = Dog("Luna", 5)
print(rex.speak())   # Rex says Woof!
print(Dog.count)     # 2`)}
 <p><code>self</code> is the object the method was called on. Writing <code>rex.speak()</code> is shorthand for <code>Dog.speak(rex)</code>, which is why every method lists <code>self</code> first.</p>
 <svg viewBox="0 0 580 170" role="img" aria-label="One Dog class produces two objects">
  <rect class="bx2" x="10" y="20" width="170" height="120" rx="8"/><text x="28" y="44" font-weight="700">class Dog</text><text x="28" y="70">count (shared)</text><text x="28" y="92">__init__(name, age)</text><text x="28" y="114">speak()</text>
  <path class="ln" d="M180 60 L290 35M180 100 L290 125"/>
  <rect class="bx" x="290" y="10" width="270" height="52" rx="8"/><text x="304" y="32">rex: name="Rex", age=3</text><text x="304" y="51" class="lab">own copy of attributes</text>
  <rect class="bx" x="290" y="102" width="270" height="52" rx="8"/><text x="304" y="124">luna: name="Luna", age=5</text><text x="304" y="143" class="lab">own copy of attributes</text>
 </svg>
 <h3>Class vs. object, side by side</h3>
 <table><tr><th></th><th>Class</th><th>Object (instance)</th></tr>
 <tr><td>What it is</td><td>Template / definition</td><td>A concrete thing built from it</td></tr>
 <tr><td>Created with</td><td><code>class Dog:</code></td><td><code>Dog("Rex", 3)</code></td></tr>
 <tr><td>Data</td><td>Class attributes (shared)</td><td>Instance attributes (own)</td></tr>
 <tr><td>How many</td><td>One</td><td>As many as you need</td></tr></table>
 <div class="demo"><b>Try it: build Dog objects</b><br>
  <input id="dn" placeholder="name" value="Rex" size="8" aria-label="Dog name"><input id="da" type="number" value="3" min="0" style="width:70px" aria-label="Dog age">
  <button class="btn" onclick="mkDog()">Create Dog</button> <button class="btn ghost" onclick="dogs=[];Dog_c=0;drawDogs()">Reset</button>
  <div class="out" id="dout">No objects yet. Click Create Dog.</div></div>
 <h3>Practical exercise</h3>
 <p>Write a class <code>Book</code> with <code>title</code> and <code>pages</code>, plus a method <code>is_long()</code> that returns <code>True</code> when pages exceed 300. Predict: what does <code>Book("A", 400).is_long()</code> print?</p>
 ${reveal("Show solution",code(`class Book:
    def __init__(self, title, pages):
        self.title = title
        self.pages = pages
    def is_long(self):
        return self.pages > 300

print(Book("A", 400).is_long())  # True`))}
 ${box("mis","Common misconceptions",`<ul><li><b>"self is a keyword."</b> It is only a convention; Python passes the instance as the first argument whatever you name it. Always use <code>self</code> anyway.</li><li><b>"A class attribute is per-object."</b> It is shared. Mutating a list defined at class level changes it for every instance.</li><li><b>"__init__ creates the object."</b> <code>__new__</code> creates it; <code>__init__</code> only initializes it.</li></ul>`)}
 ${box("key","Key takeaways","<ul><li>Class = blueprint, object = instance.</li><li><code>__init__</code> sets up instance attributes via <code>self</code>.</li><li>Class attributes are shared; instance attributes are per object.</li><li>Define <code>__repr__</code> for readable debugging output.</li></ul>")}`,
 quiz:[
 {q:"What does `self` refer to inside a method?",o:["The class itself","The specific object the method was called on","The parent class","A global variable"],a:1,e:"self is the instance. rex.speak() passes rex as self. The class is reached via type(self) or the class name, and there is no parent involved yet."},
 {q:"After `a=Dog('A',1); b=Dog('B',2)`, what is `Dog.count` if __init__ does `Dog.count += 1` and count started at 0?",o:["0","1","2","It raises an error"],a:2,e:"count lives on the class and both constructions incremented the same shared value, giving 2. Instance attributes would have given each object its own count."},
 {q:"Which line creates an instance?",o:["class Dog:","def Dog():","rex = Dog('Rex', 3)","self.rex = Dog"],a:2,e:"Calling the class like a function builds an instance. 'class Dog:' defines the blueprint, and the other options define a function or assign without calling."},
 {q:"Which method gives a developer-friendly string when you print an object in a list?",o:["__init__","__repr__","__new__","__call__"],a:1,e:"__repr__ controls how the object is shown in lists and the REPL. __init__ initializes, __new__ allocates, __call__ makes instances callable."}]},

{t:"Encapsulation and Properties",sub:"Protecting state",time:"30 min",
 body:`
 <p><b>Encapsulation</b> means bundling data with the methods that operate on it, and controlling how outside code touches that data. Callers use a small public interface; the internals can change without breaking them.</p>
 ${box("note","Analogy: the ATM","<p>You press buttons (deposit, withdraw) and see a balance. You cannot reach into the vault and change the number. The machine enforces rules: no withdrawing more than you have.</p>")}
 <svg viewBox="0 0 560 150" role="img" aria-label="Public interface wrapping private state">
  <rect class="bx" x="10" y="10" width="540" height="130" rx="10"/><text x="26" y="34" font-weight="700">Public interface</text>
  <text x="26" y="58">deposit(amount)</text><text x="26" y="80">withdraw(amount)</text><text x="26" y="102">balance (property)</text>
  <rect class="bx2" x="300" y="46" width="230" height="78" rx="8"/><text x="316" y="72" font-weight="700">Hidden state</text><text x="316" y="96">_balance, validation rules</text>
  <path class="ln" d="M170 80 L300 80"/>
 </svg>
 <h3>Three access conventions</h3>
 <table><tr><th>Syntax</th><th>Meaning</th><th>Enforced?</th></tr>
 <tr><td><code>name</code></td><td>Public API</td><td>n/a</td></tr>
 <tr><td><code>_name</code></td><td>"Internal, please don't touch"</td><td>Convention only</td></tr>
 <tr><td><code>__name</code></td><td>Name-mangled to <code>_Class__name</code></td><td>Avoids accidental clashes; not true privacy</td></tr></table>
 <h3>Properties: validation without ugly getters</h3>
 ${code(`class Account:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self._balance = balance

    @property
    def balance(self):            # read like an attribute: acct.balance
        return self._balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("Deposit must be positive")
        self._balance += amount

    def withdraw(self, amount):
        if amount > self._balance:
            raise ValueError("Insufficient funds")
        self._balance -= amount`)}
 <p>A <code>@property</code> lets you start with a plain attribute and later add validation, with no change for the callers. Add a setter with <code>@balance.setter</code> when assignment should be allowed but checked.</p>
 <div class="demo"><b>Try it: guarded account</b><br>
  <input id="am" type="number" value="50" style="width:90px" aria-label="Amount">
  <button class="btn" onclick="acct('d')">deposit</button> <button class="btn" onclick="acct('w')">withdraw</button> <button class="btn ghost" onclick="acct('x')">acct.__balance</button>
  <div class="out" id="aout">balance = 100</div></div>
 <h3>Practical exercise</h3>
 <p>Add a <code>Temperature</code> class that stores Celsius, rejects values below -273.15, and exposes a read-only <code>fahrenheit</code> property.</p>
 ${reveal("Show solution",code(`class Temperature:
    def __init__(self, c):
        self.celsius = c           # goes through the setter
    @property
    def celsius(self):
        return self._c
    @celsius.setter
    def celsius(self, v):
        if v < -273.15:
            raise ValueError("Below absolute zero")
        self._c = v
    @property
    def fahrenheit(self):
        return self._c * 9/5 + 32`))}
 ${box("mis","Common misconceptions",`<ul><li><b>"Double underscore makes it private."</b> Python only renames it; <code>acct._Account__x</code> still works. Privacy is a social contract.</li><li><b>"Write getX/setX like Java."</b> Use plain attributes first, upgrade to <code>@property</code> only when you need logic.</li></ul>`)}
 ${box("key","Key takeaways","<ul><li>Expose a small public interface; hide the rest behind <code>_</code>.</li><li><code>@property</code> adds validation while keeping attribute syntax.</li><li>Raise exceptions (<code>ValueError</code>) to reject invalid state.</li></ul>")}`,
 quiz:[
 {q:"What does a single leading underscore (`_balance`) signal?",o:["The attribute is truly inaccessible","It is internal; outside code should not rely on it","It is a class attribute","It is read-only"],a:1,e:"A single underscore is a convention for internal use. Python will not stop access, and it does not make the value read-only or shared."},
 {q:"What does `__secret` inside class `A` become?",o:["Deleted after init","_A__secret","A.secret","Locked by the interpreter"],a:1,e:"Name mangling renames it to _A__secret to prevent subclass clashes. It is still reachable, so it is not security."},
 {q:"Why use @property instead of a plain public attribute?",o:["It makes code run faster","To add validation or computed values while keeping obj.attr syntax","Python requires it","It makes data private"],a:1,e:"Properties let you add logic later without changing how callers read or write the attribute. They are not faster and not required."},
 {q:"Which is the best way to reject a negative deposit?",o:["Print a warning and continue","Silently ignore it","Raise ValueError","Return None and hope"],a:2,e:"Raising an exception makes invalid use impossible to miss. Printing or ignoring lets bad state or silent failure spread."}]},

{t:"Inheritance and Composition",sub:"Reuse and structure",time:"35 min",
 body:`
 <p><b>Inheritance</b> lets a class (child) reuse and specialize another class (parent). It models an <b>is-a</b> relationship: a Dog <em>is an</em> Animal.</p>
 ${box("note","Analogy: family recipes","<p>A child learns the family recipe (inherits), then tweaks one step (overrides) while keeping the rest. A cook who owns a stove does not inherit from Stove; they simply <em>have</em> one. That is composition.</p>")}
 <svg viewBox="0 0 560 190" role="img" aria-label="Animal parent with Dog and Puppy descendants">
  <rect class="bx2" x="200" y="8" width="160" height="42" rx="8"/><text x="236" y="34" font-weight="700">Animal</text>
  <rect class="bx" x="60" y="80" width="150" height="42" rx="8"/><text x="112" y="106">Cat</text>
  <rect class="bx" x="350" y="80" width="150" height="42" rx="8"/><text x="404" y="106">Dog</text>
  <rect class="bx" x="350" y="145" width="150" height="40" rx="8"/><text x="397" y="170">Puppy</text>
  <path class="ln" d="M250 50 L135 80M310 50 L425 80M425 122 L425 145"/>
 </svg>
 ${code(`class Animal:
    def __init__(self, name):
        self.name = name
    def speak(self):
        return "..."
    def move(self):
        return f"{self.name} moves"

class Dog(Animal):
    def speak(self):               # override
        return "Woof"

class Puppy(Dog):
    def __init__(self, name):
        super().__init__(name)     # reuse parent setup
        self.tiny = True
    def speak(self):
        return super().speak() + " (squeaky)"

print(Puppy("Bit").speak())        # Woof (squeaky)
print(Puppy.__mro__)               # lookup order`)}
 <p>Python finds a method by walking the <b>MRO</b> (method resolution order): the class, then its parents, left to right, using the C3 rule so no class appears before its own children. <code>isinstance(p, Dog)</code> is true for a Puppy; <code>type(p) is Dog</code> is not.</p>
 <div class="demo"><b>Try it: who answers the call?</b><br>
  <span id="pills"></span><div class="out" id="iout"></div></div>
 <h3>Inheritance vs. composition</h3>
 <table><tr><th></th><th>Inheritance</th><th>Composition</th></tr>
 <tr><td>Relationship</td><td>is-a</td><td>has-a</td></tr>
 <tr><td>Example</td><td><code>class Dog(Animal)</code></td><td><code>Car</code> holds an <code>Engine</code></td></tr>
 <tr><td>Coupling</td><td>Tight: child depends on parent internals</td><td>Loose: swap parts freely</td></tr>
 <tr><td>Prefer when</td><td>True specialization</td><td>Reusing behavior or combining features</td></tr></table>
 ${code(`class Engine:
    def start(self): return "vroom"
class Car:
    def __init__(self):
        self.engine = Engine()     # composition
    def start(self):
        return self.engine.start()`)}
 <h3>Practical exercise</h3>
 <p>Create <code>Employee(name, salary)</code> with <code>pay()</code> returning salary, and <code>Manager</code> that adds a <code>bonus</code> and overrides <code>pay()</code> to include it, reusing the parent with <code>super()</code>.</p>
 ${reveal("Show solution",code(`class Employee:
    def __init__(self, name, salary):
        self.name, self.salary = name, salary
    def pay(self): return self.salary

class Manager(Employee):
    def __init__(self, name, salary, bonus):
        super().__init__(name, salary)
        self.bonus = bonus
    def pay(self): return super().pay() + self.bonus`))}
 ${box("mis","Common misconceptions",`<ul><li><b>"Inheritance is for code reuse."</b> Misused, it creates fragile hierarchies. Ask "is it truly an X?" and prefer composition otherwise.</li><li><b>"super() calls the parent."</b> It calls the <em>next class in the MRO</em>, which matters with multiple inheritance.</li><li><b>"Overriding __init__ is optional to chain."</b> If you skip <code>super().__init__()</code>, parent attributes never get set.</li></ul>`)}
 ${box("key","Key takeaways","<ul><li>Use inheritance for is-a, composition for has-a.</li><li>Override to specialize; call <code>super()</code> to extend.</li><li>MRO decides which method runs; inspect with <code>Class.__mro__</code>.</li><li><code>isinstance</code> respects inheritance; <code>type(x) is</code> does not.</li></ul>")}`,
 quiz:[
 {q:"Which relationship suits inheritance?",o:["A Car has an Engine","A Dog is an Animal","A Library has Books","A User has a Password"],a:1,e:"Dog is-a Animal is a specialization. The other three are has-a relationships, which are better modeled by composition."},
 {q:"In Puppy.speak() above, what does super().speak() call?",o:["Animal.speak directly","Dog.speak, the next class in the MRO","Puppy.speak again","Nothing"],a:1,e:"super() follows the MRO: Puppy, then Dog, then Animal. Dog defines speak, so that is the one that runs."},
 {q:"If a child class skips super().__init__(...), what happens?",o:["Python calls it automatically","Parent attributes set in its __init__ are missing","A syntax error occurs","Nothing changes"],a:1,e:"Once a child defines its own __init__, Python does not chain to the parent's. Attributes the parent would set will not exist."},
 {q:"Given p = Puppy('Bit'), which is True?",o:["type(p) is Dog","isinstance(p, Dog)","isinstance(p, Cat)","p is Animal"],a:1,e:"isinstance accepts subclasses, so a Puppy counts as a Dog. type(p) is Puppy exactly, so the first option is False."}]},

{t:"Polymorphism and Abstraction",sub:"Mastery",time:"35 min",
 body:`
 <p><b>Polymorphism</b> ("many forms") means different objects respond to the same call in their own way. Code written against a shared interface works with any object that supports it, so you can add new types without editing existing code.</p>
 ${box("note","Analogy: the universal remote","<p>Press <em>Power</em>. The TV, speaker, and lamp each turn on in their own way. The remote never needs to know which device it is talking to.</p>")}
 <svg viewBox="0 0 560 170" role="img" aria-label="Shape interface with three implementations">
  <rect class="bx2" x="205" y="8" width="150" height="40" rx="8"/><text x="236" y="33" font-weight="700">Shape.area()</text>
  <rect class="bx" x="20" y="105" width="150" height="50" rx="8"/><text x="50" y="135">Circle.area()</text>

 ${code(`from abc import ABC, abstractmethod
import math

class Shape(ABC):                      # abstract base class
    @abstractmethod
    def area(self): ...

class Circle(Shape):
    def __init__(self, r): self.r = r
    def area(self): return math.pi * self.r ** 2

class Rectangle(Shape):
    def __init__(self, w, h): self.w, self.h = w, h
    def area(self): return self.w * self.h

shapes = [Circle(2), Rectangle(3, 4)]
print(sum(s.area() for s in shapes))   # one loop, many behaviors
# Shape()  -> TypeError: can't instantiate abstract class`)}
 <p><b>Abstraction</b> hides complexity behind a contract. An abstract base class (ABC) declares the methods subclasses <em>must</em> implement. Python also supports <b>duck typing</b>: if it has <code>area()</code>, it works, no inheritance required.</p>
 <div class="demo"><b>Try it: one loop, three behaviors</b><br>
  <label>Circle r <input type="range" id="s1" min="1" max="10" value="3" oninput="shp()"></label>
  <label>Rect side <input type="range" id="s2" min="1" max="10" value="4" oninput="shp()"></label>
  <label>Triangle base <input type="range" id="s3" min="1" max="10" value="5" oninput="shp()"></label>
  <div class="out" id="sout"></div></div>
 <h3>Duck typing vs. abstract base classes</h3>
 <table><tr><th></th><th>Duck typing</th><th>ABC</th></tr>
 <tr><td>Contract</td><td>Implicit</td><td>Explicit, checked at instantiation</td></tr>
 <tr><td>Error timing</td><td>When the missing method is called</td><td>When you create the object</td></tr>
 <tr><td>Best for</td><td>Small, flexible code</td><td>Large systems, plugin APIs</td></tr></table>
 <h3>Operator overloading and dataclasses</h3>
 ${code(`from dataclasses import dataclass

@dataclass
class Vec:
    x: float
    y: float
    def __add__(self, o):              # enables v1 + v2
        return Vec(self.x + o.x, self.y + o.y)

print(Vec(1, 2) + Vec(3, 4))           # Vec(x=4, y=6)`)}
 <h3>Practical exercise</h3>
 <p>Add a <code>Triangle(base, height)</code> to the shape example without changing the summing code. Then explain why that is polymorphism.</p>
 ${reveal("Show solution",code(`class Triangle(Shape):
    def __init__(self, b, h): self.b, self.h = b, h
    def area(self): return 0.5 * self.b * self.h

shapes.append(Triangle(3, 5))  # sum(...) line unchanged`)+"<p>The summing loop depends only on <code>area()</code>, so a new type plugs in without edits.</p>")}
 ${box("mis","Common misconceptions",`<ul><li><b>"Polymorphism requires inheritance."</b> In Python, duck typing gives it without a shared parent.</li><li><b>"Abstract classes can be instantiated if they have some code."</b> Any unimplemented <code>@abstractmethod</code> blocks instantiation.</li><li><b>"Overloading means same name, different arguments."</b> Python has no such overloading; use defaults or <code>functools.singledispatch</code>.</li></ul>`)}
 ${box("key","Key takeaways","<ul><li>Program to an interface (the method name), not a concrete class.</li><li>ABC + <code>@abstractmethod</code> enforces a contract at creation time.</li><li>Dunder methods (<code>__add__</code>, <code>__eq__</code>) let your objects behave like built-ins.</li><li><code>@dataclass</code> removes boilerplate for data-holding classes.</li></ul>")}`,
 quiz:[
 {q:"What best defines polymorphism?",o:["Hiding data inside a class","Different objects responding to the same call in their own way","A class inheriting from two parents","Creating many instances"],a:1,e:"Polymorphism is one interface, many behaviors. Hiding data is encapsulation, two parents is multiple inheritance, and many instances is just instantiation."},
 {q:"What happens on Shape() if Shape is an ABC with an unimplemented @abstractmethod?",o:["Returns an empty Shape","TypeError at instantiation","Nothing until area() is called","It silently succeeds"],a:1,e:"ABCs block instantiation while abstract methods remain. That early failure is exactly their advantage over pure duck typing."},
 {q:"Which dunder method makes `a + b` work for your class?",o:["__plus__","__add__","__sum__","__iadd__ only"],a:1,e:"__add__ implements +. __plus__ and __sum__ do not exist for this, and __iadd__ only handles +=."},
 {q:"Duck typing means…",o:["Objects must inherit from a common base","If an object has the needed method, it works","Types are checked at compile time","Only built-in types are allowed"],a:1,e:"Python cares about what an object can do, not what it inherits from. The other options describe nominal or static typing."}]}
];
