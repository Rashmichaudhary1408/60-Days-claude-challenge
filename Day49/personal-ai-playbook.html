<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal AI Playbook for Developers</title>
<style>
:root{--bg:#f2f5f1;--panel:#fff;--ink:#14201b;--mute:#5d6b64;--line:#d9e0da;--acc:#0f6b5c;--acc2:#e0a526;--accbg:#dff0ea;--code:#eef2ee;--r:10px}
:root[data-t=dark]{--bg:#0d1411;--panel:#16201c;--ink:#e8efe9;--mute:#93a39a;--line:#26342d;--acc:#4cc2a8;--acc2:#e9b84a;--accbg:#173a32;--code:#0f1916}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:30px}h2{font-size:21px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
aside{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;height:100vh;position:sticky;top:0}
.brand{font:600 18px Georgia,serif;padding:4px 8px 14px}.brand small{display:block;font:12px system-ui;color:var(--mute)}
.nav{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--mute);transition:.15s}
.nav:hover{background:var(--code)}.nav.on{background:var(--accbg);color:var(--acc);font-weight:600}
.side-b{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.side-b label{color:var(--mute)}
main{flex:1;min-width:0;padding:26px clamp(16px,4vw,44px) 60px;max-width:1180px}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--acc)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}[data-t=dark] .btn.p{color:#06130f}
.btn.s{padding:4px 9px;font-size:13px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.mono{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code)}
.sub{color:var(--mute);margin:4px 0 18px;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.explain{border-left:4px solid var(--acc2);display:flex;gap:14px;align-items:flex-start;margin-bottom:22px;background:var(--panel)}
.explain p{margin:4px 0}.explain ul{margin:6px 0 0;padding-left:18px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.wf{cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:.15s}.wf:hover{border-color:var(--acc);transform:translateY(-2px)}
.tag{font-size:12px;background:var(--accbg);color:var(--acc);padding:2px 8px;border-radius:99px;display:inline-block}
.tag.my{background:#f6e7bd;color:#6b4b00}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar input{max-width:280px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
[data-t=dark] .chip.on{color:#06130f}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stats b{font:600 28px Georgia,serif;display:block}
.steps{counter-reset:s;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.steps .card{position:relative;padding-left:46px}.steps .card:before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;text-align:center;font-size:13px;line-height:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.blk{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px;margin-bottom:10px;animation:in .2s}
@keyframes in{from{opacity:0;transform:scale(.98)}}
.blk .why{font-size:13px;color:var(--mute);margin:2px 0 8px}.blk .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:14px}
.pick .card{padding:10px;font-size:13px}.pick .card p{margin:2px 0 8px;color:var(--mute)}
.prev{position:sticky;top:16px}.prev pre{white-space:pre-wrap;word-break:break-word;margin:0;padding:12px;border-radius:8px;max-height:62vh;overflow:auto}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:9}.ov.on{display:flex}
.modal{background:var(--panel);border-radius:14px;padding:22px;width:min(860px,100%);animation:in .2s}
.fld{margin-bottom:10px}.fld label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;transition:.25s;z-index:20}#toast.on{transform:translate(-50%,0)}
kbd{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
#help{position:fixed;right:16px;bottom:16px;z-index:8;border-radius:99px;padding:9px 15px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}.brand{padding:2px 8px}.side-b{display:none}.two{grid-template-columns:1fr}.prev{position:static}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside>
 <div class="brand">AI Playbook<small>for software developers</small></div>
 <button class="nav" data-v="dash">Dashboard</button>
 <button class="nav" data-v="lib">My Workflows</button>
 <button class="nav" data-v="pb">Prompt Builder</button>
 <button class="nav" data-v="lb">Loop Builder</button>
 <div class="side-b">
  <label for="model">Target AI model</label>
  <select id="model"><option>Any model</option><option>Claude</option><option>ChatGPT</option><option>Gemini</option></select>
  <button class="btn s" id="dark">Toggle dark mode</button>
  <button class="btn s" id="exp">Export backup</button>
  <button class="btn s" id="imp">Import backup</button>
  <input type="file" id="file" accept=".json" hidden>
 </div>
</aside>
<main id="main"></main>
<button class="btn p" id="help" title="Press ?">What is this?</button>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={custom:[],fav:[],dark:false,hideBanner:false,model:'Any model',pb:[],lb:[],lbBase:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('aipb')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('aipb',JSON.stringify(S))}catch(e){}};
const LANG=['JavaScript','TypeScript','Python','Java','Go','C#','Rust','C++','PHP','Kotlin'];
const V=(k,label,opts,def)=>({k,label,opts:opts||[],def:def||''});
const W=[
{id:'debug',cat:'Debug & Test',t:'Debug an error',d:'Find the root cause of a bug, not just a quick patch.',vars:[V('lang','Language',LANG,'Python'),V('error','Error message or symptom'),V('code','Relevant code'),V('expected','Expected behavior')],
 tpl:`Act as a senior {{lang}} engineer debugging a problem.\n\nSymptom / error:\n{{error}}\n\nExpected behavior:\n{{expected}}\n\nRelevant code:\n{{code}}\n\nFirst list the 3 most likely root causes ranked by probability and say what evidence would confirm each. Then give the minimal fix for the most likely cause, and explain how to verify it.`,
 ex:'Error: TypeError: cannot read properties of undefined (reading "map") in a React list component.',bp:'Paste the full stack trace and only the code near it. Say what you already tried.'},
{id:'tests',cat:'Debug & Test',t:'Write unit tests',d:'Generate tests that cover edge cases, not only the happy path.',vars:[V('lang','Language',LANG,'TypeScript'),V('fw','Test framework',['Jest','Vitest','Pytest','JUnit','Go test','xUnit','RSpec'],'Jest'),V('cov','Coverage level',['Happy path only','Happy path + edge cases','Exhaustive incl. error paths'],'Happy path + edge cases'),V('code','Code to test')],
 tpl:`Write {{fw}} unit tests in {{lang}} for the code below.\nCoverage: {{cov}}.\n\nCode:\n{{code}}\n\nRules: one behavior per test, descriptive test names, no testing of private internals, mock only external I/O. After the tests, list any behavior you could not test and why.`,
 ex:'Tests for a parseDate() utility including invalid input, leap years and time zones.',bp:'Ask for the list of untested behavior; it often reveals design problems.'},
{id:'ci',cat:'Debug & Test',t:'Fix a failing CI build',d:'Turn a wall of build logs into a diagnosis and fix.',vars:[V('ci','CI tool',['GitHub Actions','GitLab CI','Jenkins','CircleCI','Azure Pipelines'],'GitHub Actions'),V('log','Failing log (last ~80 lines)'),V('change','What changed recently')],
 tpl:`My {{ci}} build is failing.\n\nRecent change:\n{{change}}\n\nLog:\n{{log}}\n\nTell me (1) the exact failing step and why, (2) whether this is a code, config, or flaky-environment problem, (3) the smallest fix, with the changed lines only.`,
 ex:'npm ci fails with ERESOLVE after a dependency bump.',bp:'Trim logs to the first error. Later errors are often side effects.'},
{id:'review',cat:'Review & Refactor',t:'Review my code',d:'Get a structured review you can act on.',vars:[V('lang','Language',LANG,'Python'),V('focus','Review focus',['Bugs','Security','Performance','Readability','All of the above'],'All of the above'),V('code','Code or diff')],
 tpl:`Review this {{lang}} code. Focus: {{focus}}.\n\n{{code}}\n\nFormat: a table with columns Severity (blocker/major/minor/nit), Location, Problem, Suggested fix. End with the single most important change.`,
 ex:'Review a Flask endpoint that builds SQL strings by hand.',bp:'Name one focus. "Review everything" produces shallow feedback.'},
{id:'refactor',cat:'Review & Refactor',t:'Refactor safely',d:'Improve structure without changing behavior.',vars:[V('lang','Language',LANG,'JavaScript'),V('goal','Refactor goal',['Reduce duplication','Improve naming','Split large function','Add types','Reduce complexity'],'Split large function'),V('code','Code')],
 tpl:`Refactor this {{lang}} code. Goal: {{goal}}.\n\n{{code}}\n\nConstraints: keep external behavior identical, keep public signatures, change one concern at a time. Show the refactored code, then a short list of what changed and any risks I should cover with tests.`,
 ex:'Split a 200-line handleSubmit() into validation, mapping and API calls.',bp:'Ask for tests first if the code has none.'},
{id:'commit',cat:'Git & PRs',t:'Write a commit message',d:'Clear commit messages from a diff in seconds.',vars:[V('style','Style',['Conventional Commits','Plain imperative','Gitmoji'],'Conventional Commits'),V('diff','Git diff or summary')],
 tpl:`Write a commit message in {{style}} style for this change:\n\n{{diff}}\n\nSubject under 72 characters, imperative mood. Add a body explaining why, not what, only if the reason is not obvious.`,
 ex:'feat(auth): add refresh token rotation',bp:'Include the reason for the change in your input; the diff only shows the what.'},
{id:'pr',cat:'Git & PRs',t:'Write a PR description',d:'Make reviewers faster with a complete description.',vars:[V('aud','Reviewer audience',['Teammates who know the code','Cross-team reviewers','Open-source maintainers'],'Teammates who know the code'),V('diff','Diff, commits or notes')],
 tpl:`Write a pull request description for {{aud}}.\n\nSource material:\n{{diff}}\n\nSections: Summary (2 sentences), What changed (bullets), Why, How to test, Risks and rollback, Screenshots needed (yes/no).`,
 ex:'PR that migrates date handling from moment to date-fns.',bp:'Keep the "How to test" section concrete with commands.'},
{id:'changelog',cat:'Git & PRs',t:'Draft release notes',d:'Turn commit history into user-facing notes.',vars:[V('fmt','Format',['Keep a Changelog','Marketing-friendly','Terse bullets'],'Keep a Changelog'),V('commits','Commit list')],
 tpl:`Turn these commits into release notes in {{fmt}} format. Group by Added, Changed, Fixed, Removed. Drop internal chores. Rewrite for users, not developers.\n\n{{commits}}`,
 ex:'v2.4.0 notes from 40 commits.',bp:'Flag breaking changes in a separate section.'},
{id:'boiler',cat:'Boilerplate & Scripts',t:'Generate boilerplate',d:'Scaffold repeated code in your project conventions.',vars:[V('lang','Language',LANG,'TypeScript'),V('what','What to scaffold'),V('conv','Conventions to follow')],
 tpl:`Generate {{lang}} boilerplate for: {{what}}.\n\nFollow these conventions:\n{{conv}}\n\nOutput only code, split by file with the file path as a heading. Add TODO comments where I must fill in logic.`,
 ex:'A REST resource with controller, service, DTO and test stub.',bp:'Paste one existing file as a style example. It beats describing conventions.'},
{id:'script',cat:'Boilerplate & Scripts',t:'Write an automation script',d:'Small scripts for chores you do repeatedly.',vars:[V('sh','Language',['Bash','PowerShell','Python','Node.js'],'Bash'),V('task','Task'),V('os','OS',['Linux','macOS','Windows'],'Linux')],
 tpl:`Write a {{sh}} script for {{os}} that does this: {{task}}\n\nRequirements: fail fast on errors, print clear progress messages, accept arguments instead of hardcoding paths, include a --dry-run option, and add a usage comment at the top.`,
 ex:'Rename and compress all screenshots older than 30 days.',bp:'Always run with dry-run first.'},
{id:'config',cat:'Boilerplate & Scripts',t:'Create a config file',d:'Dockerfiles, pipelines and infrastructure files.',vars:[V('tool','File type',['Dockerfile','docker-compose','GitHub Actions workflow','nginx config','Terraform','Kubernetes manifest'],'Dockerfile'),V('req','Requirements')],
 tpl:`Create a production-ready {{tool}} for these requirements:\n{{req}}\n\nUse current best practices, pin versions, and avoid secrets in the file. Add short comments explaining non-obvious choices, then list what I should double-check before deploying.`,
 ex:'Multi-stage Dockerfile for a Node 20 API running as non-root.',bp:'State your versions and hosting target.'},
{id:'explain',cat:'Understand Code',t:'Explain unfamiliar code',d:'Understand code you did not write.',vars:[V('lvl','Explain like I am',['New to this language','Comfortable but new to this codebase','An expert wanting a summary'],'Comfortable but new to this codebase'),V('code','Code')],
 tpl:`Explain this code. Audience: {{lvl}}.\n\n{{code}}\n\nGive: (1) one-sentence purpose, (2) step-by-step walkthrough, (3) hidden assumptions or gotchas, (4) three questions I should ask the original author.`,
 ex:'A 150-line regex-heavy parser.',bp:'Ask follow-up questions on specific lines.'},
{id:'legacy',cat:'Understand Code',t:'Map a legacy codebase',d:'Build a mental map before changing anything.',vars:[V('lang','Main language',LANG,'Java'),V('tree','Folder tree or key files')],
 tpl:`I inherited a {{lang}} codebase. Here is its structure:\n\n{{tree}}\n\nInfer the architecture. Output: likely layers and responsibilities, entry points, where business logic probably lives, risky areas to avoid touching first, and a 5-step plan to learn it safely.`,
 ex:'A 10-year-old Spring monolith with no docs.',bp:'Say clearly that these are inferences to verify.'},
{id:'readme',cat:'Docs, Architecture & Learning',t:'Write a README',d:'Project docs people will actually read.',vars:[V('aud','Reader',['New contributors','End users','Hiring managers viewing a portfolio'],'Hiring managers viewing a portfolio'),V('proj','Project details')],
 tpl:`Write a README for {{aud}}.\n\nProject details:\n{{proj}}\n\nInclude: one-line pitch, features, quick start (copy-paste commands), configuration table, project structure, and roadmap. Keep it scannable.`,
 ex:'README for a CLI that syncs notes to Git.',bp:'Put the quick start in the first screen.'},
{id:'adr',cat:'Docs, Architecture & Learning',t:'Compare design options',d:'Decide between technical approaches with reasoning.',vars:[V('dec','Decision to make'),V('opts','Options considered'),V('con','Constraints')],
 tpl:`Help me decide: {{dec}}\n\nOptions: {{opts}}\nConstraints: {{con}}\n\nCompare options in a table (complexity, cost, scalability, risk, team fit). Recommend one, state what would change your mind, and write the result as a short Architecture Decision Record.`,
 ex:'Postgres vs MongoDB for an event log.',bp:'Real constraints beat abstract pros and cons.'},
{id:'learn',cat:'Docs, Architecture & Learning',t:'Learn a new technology',d:'A focused learning plan with practice.',vars:[V('topic','Topic'),V('time','Time per day',['30 minutes','1 hour','2 hours'],'1 hour'),V('lvl','Current level',['Never used it','Know the basics','Used it a little'],'Know the basics')],
 tpl:`Create a 2-week learning plan for {{topic}}. I have {{time}} per day and my level is: {{lvl}}.\n\nFor each day give a goal, one concept to study, one small hands-on exercise, and a way to self-check. End with a capstone project idea.`,
 ex:'Learn Rust ownership in two weeks.',bp:'Ask for exercises, not only explanations.'}];
const all=()=>[...W,...S.custom];const find=id=>all().find(w=>w.id===id);
const vars=t=>[...new Set([...t.matchAll(/\{\{(\w+)\}\}/g)].map(m=>m[1]))];
const fill=(t,v)=>t.replace(/\{\{(\w+)\}\}/g,(m,k)=>v[k]||'['+k+']');
const modelNote=()=>({Claude:'\n\n(Tip: wrap pasted code and logs in <code> tags so the sections stay clearly separated.)',ChatGPT:'\n\n(Tip: reply step by step and ask me before assuming missing details.)',Gemini:'\n\n(Tip: state your assumptions explicitly before answering.)'}[S.model]||'');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('on'),1600)};
const copy=async txt=>{try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Copied to clipboard')};
const modal=h=>{$('#modal').innerHTML=h;$('#ov').classList.add('on')};const closeM=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{if(e.target.id==='ov')closeM()};

/* ---- Building blocks (shared by both builders) ---- */
const PB={
role:{n:'Role',d:'Who the AI should act as.',why:'A specific role sets the expertise level and vocabulary of the answer.',o:['You are a senior software engineer with 10 years of experience.','You are a meticulous code reviewer focused on security.','You are a patient tutor who explains concepts to beginners.','You are a staff engineer writing for a busy team.']},
obj:{n:'Objective',d:'What you want done.',why:'One clear task prevents the AI from guessing what you meant.',o:['Find and fix the bug in the code below.','Explain how the code below works.','Refactor the code below for readability.','Write tests for the code below.','Draft documentation for the code below.']},
ctx:{n:'Context',d:'Background the AI cannot know.',why:'Stack, versions and constraints stop generic answers that do not fit your project.',o:['Stack: [language, framework, versions]. Project: [what it does].','This is a production service. Changes must be backward compatible.','This is a side project. Prefer simple solutions over perfect ones.','I am new to this codebase and have no documentation.']},
con:{n:'Constraints',d:'Rules the answer must follow.',why:'Limits keep the output within your standards and scope.',o:['Do not change public function signatures.','Use only the standard library.','Keep the answer under 300 words.','Do not add new dependencies.','If something is unclear, ask me before answering.']},
rea:{n:'Reasoning strategy',d:'How the AI should think before answering.',why:'Asking for steps or alternatives improves accuracy on complex tasks.',o:['Think step by step before giving the final answer.','List 3 possible approaches, compare them, then pick one.','State your assumptions first, then answer.','Solve it, then re-check your answer for mistakes.']},
fmt:{n:'Output format',d:'The shape of the answer.',why:'A fixed format makes results easy to scan, paste and reuse.',o:['Return only code, with file names as headings.','Use a table: Problem, Cause, Fix.','Use short bullet points, no paragraphs.','Give a one-paragraph summary, then details.','Return valid JSON only.']},
tone:{n:'Tone',d:'The voice of the answer.',why:'Tone controls how formal, blunt or friendly the response reads.',o:['Direct and concise.','Friendly and encouraging.','Formal and professional.','Blunt: point out every flaw.']},
exm:{n:'Examples',d:'A sample of what good looks like.',why:'One example shows the pattern better than a paragraph of instructions.',o:['Example input: [paste]\nExample output: [paste]','Follow the style of this existing code: [paste]','Good: "fix(api): handle null user". Bad: "fixed stuff".']},
qc:{n:'Quality checks',d:'Checks the AI runs on its own answer.',why:'Self-checks catch errors before you do.',o:['Before answering, verify the code compiles logically and handles empty input.','Double-check every claim and say if you are unsure.','End with a checklist of what I should test.','Point out any part of your answer you are less than 90% sure about.']}};
const LB={
goal:{n:'Goal',d:'The finished result you want.',why:'The loop needs a clear target so it knows what "done" means.',o:['Working code that passes all given tests.','A document with no factual errors or vague sections.','A refactor that is shorter and fully behavior-compatible.','A complete, clear answer rated 9/10 on all criteria.']},
crit:{n:'Evaluation criteria',d:'How each attempt is scored.',why:'Without measurable criteria the AI cannot tell if it improved.',o:['Score 1-10 on: correctness, readability, edge-case handling.','Check: compiles, passes the tests, follows the style guide.','Score 1-10 on: accuracy, completeness, clarity.','Pass/fail on each requirement in my list.']},
imp:{n:'Improvement strategy',d:'What to change each round.',why:'A focused strategy stops random rewrites and makes every round better.',o:['Fix only the lowest-scoring criterion each round.','Critique your own attempt, list 3 weaknesses, fix them.','Try a different approach if the score did not rise.','Make the smallest change that could raise the score.']},
stop:{n:'Stop conditions',d:'When the loop must end.',why:'Stops prevent endless loops and wasted time or tokens.',o:['Stop when every criterion scores 9 or higher.','Stop after 5 iterations at most.','Stop if two rounds in a row show no improvement.','Stop when all tests pass.']},
safe:{n:'Safety rules',d:'Things the loop must never do.',why:'Guardrails protect your files, data and scope.',o:['Never delete or overwrite files; propose changes only.','Never run commands or change anything outside the task.','Do not invent facts; mark unknowns as "unknown".','Ask me before any step that is irreversible.']}};
function builder(root,defs,key,intro,render){
 const used=S[key];
 const add=k=>{used.push({k,v:''});save();draw()};
 const draw=()=>{
  const free=Object.keys(defs).filter(k=>!used.some(u=>u.k===k));
  $(root).innerHTML=`${intro}<div class="two"><div>
  <h3>Add a building block</h3><p class="sub" style="margin:2px 0 8px">Each block is one part of a good prompt. Click to add it.</p>
  <div class="pick">${free.map(k=>`<div class="card"><b>${defs[k].n}</b><p>${defs[k].d} ${defs[k].why}</p><button class="btn s" data-add="${k}">Add block</button></div>`).join('')||'<div class="empty" style="grid-column:1/-1">All blocks added.</div>'}</div>
  <h3>Your blocks</h3>
  ${used.map((u,i)=>{const d=defs[u.k];return `<div class="blk"><div class="row"><b>${d.n}</b><span><button class="btn s" data-up="${i}" aria-label="Move up">Up</button> <button class="btn s" data-dn="${i}" aria-label="Move down">Down</button> <button class="btn s" data-rm="${i}">Remove</button></span></div><div class="why"><b>What it does:</b> ${d.d} <b>Why it matters:</b> ${d.why}</div>
  <select data-pre="${i}"><option value="">Choose a ready-made option...</option>${d.o.map((o,j)=>`<option value="${j}">${esc(o.slice(0,80))}</option>`).join('')}</select>
  <textarea data-val="${i}" style="margin-top:6px;min-height:60px" placeholder="Or write your own...">${esc(u.v)}</textarea></div>`}).join('')||'<div class="empty">No blocks yet. Add one from the list above and it will appear here with a live preview on the right.</div>'}
  </div><div class="prev card"><div class="row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h3>Live preview</h3><span><button class="btn s p" id="cp-${key}">Copy</button> ${key==='pb'?'<button class="btn s" id="sv-pb">Save as workflow</button> <button class="btn s" id="tol">Make a loop</button>':''}</span></div><pre class="mono" id="pv-${key}"></pre></div></div>`;
  upd();
  $(root).querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
  $(root).querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{used.splice(+b.dataset.rm,1);save();draw()});
  $(root).querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;if(i>0){[used[i-1],used[i]]=[used[i],used[i-1]];save();draw()}});
  $(root).querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;if(i<used.length-1){[used[i+1],used[i]]=[used[i],used[i+1]];save();draw()}});
  $(root).querySelectorAll('[data-pre]').forEach(s=>s.onchange=()=>{if(s.value==='')return;const i=+s.dataset.pre;used[i].v=defs[used[i].k].o[+s.value];save();draw()});
  $(root).querySelectorAll('[data-val]').forEach(t=>t.oninput=()=>{used[+t.dataset.val].v=t.value;save();upd()});
  $('#cp-'+key).onclick=()=>copy($('#pv-'+key).textContent);
  if(key==='pb'){$('#sv-pb').onclick=()=>editWF({t:'My built prompt',cat:'My Workflows',d:'Built in Prompt Builder.',tpl:$('#pv-pb').textContent});$('#tol').onclick=()=>{S.lbBase=$('#pv-pb').textContent;save();nav('lb')}}
 };
 const upd=()=>{$('#pv-'+key).textContent=render(used,defs)||'Your assembled prompt will appear here as you add blocks.'};
 draw();
}
const pbRender=(u,d)=>u.filter(x=>x.v.trim()).map(x=>`## ${d[x.k].n}\n${x.v.trim()}`).join('\n\n')+(u.some(x=>x.v.trim())?modelNote():'');
const lbRender=(u,d)=>{const g=k=>(u.find(x=>x.k===k)||{}).v||'';const h=u.filter(x=>x.v.trim()).map(x=>`## ${d[x.k].n}\n${x.v.trim()}`).join('\n\n');
 if(!S.lbBase.trim()&&!h)return'';
 return `You are running as an autonomous improvement loop. Work through the task below in repeated rounds until a stop condition is met.\n\n## Task\n${S.lbBase.trim()||'[Paste your prompt in the box on the left]'}\n\n${h}\n\n## Loop procedure\nRepeat:\n1. Attempt: produce your best answer to the task.\n2. Evaluate: score the attempt${g('crit')?' using the evaluation criteria':''} and show the scores.\n3. Check: if ${g('stop')?'a stop condition':'the goal'} is met, output "FINAL ANSWER:" followed by the result and stop.\n4. Improve: ${g('imp')?'apply the improvement strategy':'fix the weakest point'} and start the next round.\nLabel each round "Round N". Obey the safety rules at every step.`+modelNote()};

/* ---- Views ---- */
const views={
dash(){
 const cats=[...new Set(all().map(w=>w.cat))];const favs=all().filter(w=>S.fav.includes(w.id));
 return `${S.hideBanner?'':`<div class="card explain"><div><h2>What is this?</h2><p>This is your personal playbook for working with AI as a developer. Instead of retyping prompts, you keep reusable prompt templates here, fill in a few blanks, and copy the result into any AI chat.</p><ul><li><b>My Workflows:</b> ready-made templates for debugging, tests, reviews, commits and more. Edit, favorite or add your own.</li><li><b>Prompt Builder:</b> assemble a prompt from labeled blocks when a task is complex.</li><li><b>Loop Builder:</b> turn any prompt into one that checks and improves its own work.</li></ul></div><button class="btn s" id="hideb">Dismiss</button></div>`}
 <h1>Dashboard</h1><p class="sub">Your saved AI prompt workflows, at a glance. Everything is stored in this browser only.</p>
 <div class="stats"><div class="card"><b>${all().length}</b>Workflows</div><div class="card"><b>${favs.length}</b>Favorites</div><div class="card"><b>${S.custom.length}</b>Created by you</div><div class="card"><b>${cats.length}</b>Categories</div></div>
 <h2 style="margin-bottom:10px">Start here</h2><div class="steps">
 <div class="card"><b>Pick a workflow</b><br>Open My Workflows and choose a task you repeat, such as "Write a commit message".</div>
 <div class="card"><b>Fill in the blanks</b><br>Choose values from the dropdowns, paste your code, then click Copy.</div>
 <div class="card"><b>Build harder prompts</b><br>For complex tasks, use the Prompt Builder to add role, constraints and output format step by step.</div></div>
 <h2 style="margin:24px 0 10px">Browse by category</h2><div class="bar">${cats.map(c=>`<button class="chip" data-cat="${esc(c)}">${esc(c)} (${all().filter(w=>w.cat===c).length})</button>`).join('')}</div>
 <h2 style="margin:18px 0 10px">Favorites</h2>${favs.length?`<div class="grid">${favs.map(card).join('')}</div>`:'<div class="empty">No favorites yet. Open a workflow and click Favorite to pin it here.</div>'}`},
lib(){return `<h1>My Workflows</h1><p class="sub">Reusable prompt templates for your daily developer tasks. Open one to fill in its variables and copy the finished prompt.</p>
 <div class="bar"><input id="q" type="search" placeholder="Search workflows (press /)" aria-label="Search workflows" value="${esc(S.q||'')}"><button class="chip" id="fv">Favorites only</button><button class="btn p" id="nw">New workflow</button></div>
 <div class="bar" id="chips"></div><div class="grid" id="grid"></div>`},
pb(){return `<h1>Prompt Builder</h1><p class="sub">Assemble a prompt from reusable building blocks. Add the blocks you need, pick a ready-made option for each, and watch the full prompt build on the right.</p><div id="bx"></div>`},
lb(){return `<h1>Loop Builder</h1><p class="sub">Turn any normal prompt into a self-improving loop: the AI attempts the task, scores itself, improves, and stops when your conditions are met.</p>
 <div class="card" style="margin-bottom:14px"><div class="fld"><label for="base"><b>Step 1.</b> Your normal prompt</label><textarea id="base" placeholder="Paste a prompt or choose a workflow below...">${esc(S.lbBase)}</textarea></div>
 <div class="fld"><label for="lw">Or load a workflow template</label><select id="lw"><option value="">Choose a workflow...</option>${all().map(w=>`<option value="${w.id}">${esc(w.t)}</option>`).join('')}</select></div></div><div id="bx"></div>`}};
let cat='All',fvOnly=false,view='dash';
const card=w=>`<div class="card wf" tabindex="0" role="button" data-open="${w.id}"><div style="display:flex;justify-content:space-between"><span class="tag${w.my?' my':''}">${esc(w.cat)}</span><span>${S.fav.includes(w.id)?'★':''}</span></div><h3>${esc(w.t)}</h3><span style="color:var(--mute);font-size:14px">${esc(w.d||'')}</span></div>`;
function nav(v){view=v;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#main').innerHTML=views[v]();bind[v]&&bind[v]();window.scrollTo(0,0)}
const openers=()=>document.querySelectorAll('[data-open]').forEach(c=>{c.onclick=()=>openWF(c.dataset.open);c.onkeydown=e=>{if(e.key==='Enter')openWF(c.dataset.open)}});
function grid(){
 const q=(S.q||'').toLowerCase();const cats=['All',...new Set(all().map(w=>w.cat))];
 $('#chips').innerHTML=cats.map(c=>`<button class="chip${c===cat?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
 $('#chips').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;grid()});
 const l=all().filter(w=>(cat==='All'||w.cat===cat)&&(!fvOnly||S.fav.includes(w.id))&&(w.t+w.d+w.tpl+w.cat).toLowerCase().includes(q));
 $('#grid').innerHTML=l.map(card).join('')||'<div class="empty" style="grid-column:1/-1">No workflows match. Clear the search or create a new workflow.</div>';openers();
 $('#fv').classList.toggle('on',fvOnly)}
const bind={
dash(){const h=$('#hideb');if(h)h.onclick=()=>{S.hideBanner=true;save();nav('dash')};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;nav('lib')});openers()},
lib(){$('#q').oninput=e=>{S.q=e.target.value;grid()};$('#fv').onclick=()=>{fvOnly=!fvOnly;grid()};$('#nw').onclick=()=>editWF();grid()},
pb(){builder('#bx',PB,'pb','',pbRender)},
lb(){const draw=()=>builder('#bx',LB,'lb','',lbRender);draw();
 $('#base').oninput=e=>{S.lbBase=e.target.value;save();$('#pv-lb').textContent=lbRender(S.lb,LB)||'Your assembled prompt will appear here as you add blocks.'};
 $('#lw').onchange=e=>{const w=find(e.target.value);if(w){S.lbBase=w.tpl;save();nav('lb')}}}};

/* ---- Workflow modal ---- */
function openWF(id){
 const w=find(id);const vs=w.vars||vars(w.tpl).map(k=>V(k,k));const val={};vs.forEach(v=>val[v.k]=v.def||'');let tpl=w.tpl;
 modal(`<div style="display:flex;justify-content:space-between;gap:10px"><div><span class="tag${w.my?' my':''}">${esc(w.cat)}</span><h2 style="margin-top:6px">${esc(w.t)}</h2><p class="sub" style="margin-bottom:10px">${esc(w.d||'')}</p></div><button class="btn s" id="x" style="height:32px">Close</button></div>
 <div class="two"><div><h3 style="margin-bottom:8px">1. Fill in the variables</h3><div class="fgrid">${vs.map(v=>`<div class="fld"><label for="v_${v.k}">${esc(v.label)}</label>${v.opts.length?`<input id="v_${v.k}" list="dl_${v.k}" value="${esc(v.def)}"><datalist id="dl_${v.k}">${v.opts.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:`<textarea id="v_${v.k}" style="min-height:54px" placeholder="${esc(v.label)}">${esc(v.def)}</textarea>`}</div>`).join('')}</div>
 <div class="fld"><label for="tp">Template (editable, use {{variable}} for blanks)</label><textarea id="tp" class="mono" style="min-height:170px">${esc(w.tpl)}</textarea></div></div>
 <div><h3 style="margin-bottom:8px">2. Copy your prompt</h3><pre class="mono card" id="out" style="white-space:pre-wrap;margin:0 0 10px;max-height:300px;overflow:auto"></pre>
 <div class="bar"><button class="btn p" id="c1">Copy prompt</button><button class="btn" id="c2">Make a loop</button></div>
 ${w.ex?`<p><b>Example:</b> ${esc(w.ex)}</p>`:''}${w.bp?`<p><b>Best practice:</b> ${esc(w.bp)}</p>`:''}</div></div>
 <div class="bar" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><button class="btn" id="fav">${S.fav.includes(w.id)?'Unfavorite':'Favorite'}</button><button class="btn" id="dup">Duplicate</button><button class="btn" id="ed">${w.my?'Edit':'Edit as my copy'}</button>${w.my?'<button class="btn" id="del">Delete</button>':''}</div>`);
 const upd=()=>{$('#out').textContent=fill($('#tp').value,val)+modelNote()};
 vs.forEach(v=>$('#v_'+v.k).oninput=e=>{val[v.k]=e.target.value;upd()});$('#tp').oninput=upd;upd();
 $('#x').onclick=closeM;$('#c1').onclick=()=>copy($('#out').textContent);
 $('#c2').onclick=()=>{S.lbBase=$('#out').textContent;save();closeM();nav('lb')};
 $('#fav').onclick=()=>{S.fav=S.fav.includes(w.id)?S.fav.filter(x=>x!==w.id):[...S.fav,w.id];save();toast('Favorites updated');closeM();nav(view)};
 $('#dup').onclick=()=>{S.custom.push({...w,id:'c'+Date.now(),t:w.t+' (copy)',my:true});save();toast('Duplicated');closeM();nav(view)};
 $('#ed').onclick=()=>editWF(w);
 if(w.my)$('#del').onclick=()=>{if(confirm('Delete this workflow?')){S.custom=S.custom.filter(x=>x.id!==w.id);S.fav=S.fav.filter(x=>x!==w.id);save();closeM();nav(view)}}}
function editWF(w){
 const isNew=!w||!w.id,own=w&&w.my;const cats=[...new Set(all().map(x=>x.cat))];const x=w||{t:'',cat:'My Workflows',d:'',tpl:''};
 modal(`<h2>${own?'Edit workflow':'Create a workflow'}</h2><p class="sub">Write the prompt and put {{variable_name}} where the blanks should be. They become fill-in fields automatically.</p>
 <div class="fgrid"><div class="fld"><label for="e1">Title</label><input id="e1" value="${esc(x.t)}"></div><div class="fld"><label for="e2">Category</label><input id="e2" list="cl" value="${esc(x.cat)}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div></div>
 <div class="fld"><label for="e3">Short description</label><input id="e3" value="${esc(x.d||'')}"></div>
 <div class="fld"><label for="e4">Prompt template</label><textarea id="e4" class="mono" style="min-height:180px" placeholder="Review this {{language}} code and list bugs:\n{{code}}">${esc(x.tpl)}</textarea></div>
 <div class="bar"><button class="btn p" id="sv">Save workflow</button><button class="btn" id="cn">Cancel</button></div>`);
 $('#cn').onclick=closeM;$('#sv').onclick=()=>{const t=$('#e1').value.trim(),tp=$('#e4').value.trim();if(!t||!tp){toast('Add a title and a template');return}
  const o={id:own?x.id:'c'+Date.now(),t,cat:$('#e2').value.trim()||'My Workflows',d:$('#e3').value,tpl:tp,my:true,ex:x.ex,bp:x.bp};
  if(own)S.custom=S.custom.map(c=>c.id===o.id?o:c);else S.custom.push(o);save();closeM();toast('Saved');nav(view==='pb'?'lib':view)}}
function help(){modal(`<h2>What is this?</h2><p>The <b>Personal AI Playbook</b> is a private toolkit for developers who use AI chat tools. It saves you from rewriting prompts and teaches you how to structure them.</p>
<p><b>Dashboard:</b> overview, favorites and where to start.<br><b>My Workflows:</b> prompt templates with fill-in variables. Create, edit, duplicate, favorite, search and filter them.<br><b>Prompt Builder:</b> stack labeled blocks (role, objective, context, constraints, reasoning strategy, output format, tone, examples, quality checks) into one prompt.<br><b>Loop Builder:</b> wrap a prompt so the AI evaluates and improves its own output until a stop condition is met.</p>
<p><b>Shortcuts:</b> <kbd>/</kbd> search, <kbd>n</kbd> new workflow, <kbd>1</kbd>-<kbd>4</kbd> switch section, <kbd>d</kbd> dark mode, <kbd>?</kbd> this help, <kbd>Esc</kbd> close.</p>
<p style="color:var(--mute)">Data is saved in your browser (localStorage). Use Export backup in the sidebar to keep a copy.</p><button class="btn p" id="ok">Got it</button>`);$('#ok').onclick=closeM}

/* ---- Global ---- */
const setTheme=()=>document.documentElement.dataset.t=S.dark?'dark':'light';
$('#dark').onclick=()=>{S.dark=!S.dark;save();setTheme()};
$('#model').value=S.model;$('#model').onchange=e=>{S.model=e.target.value;save()};
$('#help').onclick=help;
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='ai-playbook-backup.json';a.click();toast('Backup exported')};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{Object.assign(S,JSON.parse(r.result));save();setTheme();nav(view);toast('Backup imported')}catch(x){toast('That file is not a valid backup')}};r.readAsText(f)};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.v));
document.addEventListener('keydown',e=>{const t=e.target.tagName;if(e.key==='Escape')closeM();if(['INPUT','TEXTAREA','SELECT'].includes(t)||e.metaKey||e.ctrlKey)return;
 if(e.key==='/'){e.preventDefault();nav('lib');$('#q').focus()}else if(e.key==='n')editWF();else if(e.key==='d'){S.dark=!S.dark;save();setTheme()}else if(e.key==='?')help();
 else if('1234'.includes(e.key)&&e.key)nav(['dash','lib','pb','lb'][+e.key-1])});
setTheme();nav('dash');
if(!localStorage.getItem('aipb_seen')){try{localStorage.setItem('aipb_seen','1')}catch(e){}help()}
</script></body></html>
