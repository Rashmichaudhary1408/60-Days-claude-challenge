<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defend Your Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ef;--surface:#ffffff;--soft:#fdeedd;--ink:#3a2a3d;--mute:#7b6a7e;--line:#f0dfcc;--brand:#7a5cc7;--brand-ink:#fff;--good:#3f9d74;--mid:#e0a12b;--bad:#d9634f;--shadow:0 8px 24px rgba(90,60,90,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a2b;--surface:#30243a;--soft:#3b2d47;--ink:#f6ebe0;--mute:#b9a8be;--line:#473755;--brand:#a98cf0;--brand-ink:#20142c;--good:#62c79b;--mid:#f0bd55;--bad:#f08a76;--shadow:0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241a2b;--surface:#30243a;--soft:#3b2d47;--ink:#f6ebe0;--mute:#b9a8be;--line:#473755;--brand:#a98cf0;--brand-ink:#20142c;--good:#62c79b;--mid:#f0bd55;--bad:#f08a76;--shadow:0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Nunito,system-ui,sans-serif;line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.5vw,3.4rem);font-weight:800}h2{font-size:1.5rem;font-weight:700}h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 1em}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;max-width:1080px;margin:0 auto}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.logo{width:34px;height:34px;border-radius:12px 12px 12px 4px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.small{padding:5px 13px;font-size:.88rem}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.hero{display:grid;gap:28px;grid-template-columns:1.1fr .9fr;align-items:start;padding:20px 0}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.lede{font-size:1.15rem;color:var(--mute);max-width:46ch}
.how{display:grid;gap:10px;margin-top:20px}
.how div{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:18px;padding:12px 16px}
.how b{display:block}
.drop{border:3px dashed var(--line);border-radius:22px;padding:22px;text-align:center;background:var(--soft);transition:border-color .2s,background .2s}
.drop.over{border-color:var(--brand);background:var(--surface)}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface);resize:vertical}
select{border:2px solid var(--line);border-radius:14px;padding:9px 12px;background:var(--surface);width:100%}
label{font-weight:700;font-size:.92rem;display:block;margin:12px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute);font-size:.92rem}
.banner{background:var(--soft);border:2px solid var(--mid);border-radius:16px;padding:12px 16px;margin:12px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hist{display:grid;gap:10px;margin-top:14px}
.hist .item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.empty{text-align:center;padding:26px 14px;color:var(--mute);border:2px dashed var(--line);border-radius:20px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.claims{display:grid;gap:8px;position:sticky;top:10px}
@media(max-width:860px){.claims{position:static;display:flex;overflow-x:auto;padding-bottom:6px}.claims .cl{min-width:220px}}
.cl{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;cursor:pointer;display:block;width:100%}
.cl.on{border-color:var(--brand);background:var(--soft)}
.cl span.t{display:block;font-size:.9rem;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s ease}
.tag{display:inline-block;border-radius:99px;padding:2px 11px;font-size:.82rem;font-weight:700;background:var(--soft)}
.msg{border-radius:20px;padding:12px 16px;margin:10px 0;max-width:92%}
.msg.q{background:var(--soft);border-bottom-left-radius:6px}
.msg.a{background:var(--brand);color:var(--brand-ink);margin-left:auto;border-bottom-right-radius:6px;white-space:pre-wrap}
.fb{border-left:5px solid var(--brand);background:var(--surface);border-radius:6px 18px 18px 6px;padding:12px 16px;margin:10px 0;border-top:2px solid var(--line);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
.fb ul{margin:4px 0 8px;padding-left:20px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media(max-width:620px){.stats{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring text{font-family:"Bricolage Grotesque",sans-serif;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin:0 2px;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="home" aria-label="Go to start"><span class="logo">D</span>Defend Your Experience</button>
  <nav><button class="btn small" id="themeBtn" aria-label="Toggle light or dark theme">Theme</button><button class="btn small primary" id="newBtn">New session</button></nav>
</header>
<main class="wrap" id="app"></main>

<script>
(function(){
"use strict";
var KEY="dye.v1";
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var store={sessions:[]},cur=null,view="home",busy=false,banner=null,retryFn=null,draft="",docDraft="",formOpts={mode:"recruiter",role:""};
try{var raw=localStorage.getItem(KEY);if(raw)store=JSON.parse(raw)||store}catch(e){}
function save(){try{if(cur){var i=store.sessions.findIndex(function(s){return s.id===cur.id});if(i<0)store.sessions.unshift(cur);else store.sessions[i]=cur}localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
try{var th=localStorage.getItem("dye.theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}

var MODES={recruiter:"a friendly recruiter doing a first screening call: warm, curious, but always asking for the concrete specifics (what you personally did, how you know, what changed)",skeptic:"a skeptical hiring manager who doubts vague claims and probes for ownership, trade-offs and evidence",tech:"a technical panel member who digs into how things actually worked, decisions, failures and numbers",exec:"a senior executive who cares about business impact, judgment and scope of ownership"};
var EXAMPLE="Senior Product Designer, Brightleaf (2021–2024)\n- Led the redesign of the onboarding flow, increasing activation by 32%.\n- Managed a team of 4 designers and mentored 2 junior hires.\n- Built the company’s first design system used across 5 product teams.\n- Reduced support tickets by 40% by simplifying the billing page.\n- Ran weekly user research sessions with over 100 customers.";

function mode(){return MODES[cur?cur.mode:"recruiter"]}
function parseJSON(t){t=String(t||"").replace(/```json|```/g,"");var a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<0)throw{code:"parse",message:"The reply wasn’t readable."};return JSON.parse(t.slice(a,b+1))}
async function ask(prompt){
  var sample=await claude.use("sample");
  if(!sample)throw{code:"unavailable",message:"Claude isn’t available in this view."};
  for(var i=0;;i++){
    try{var r=await sample(prompt,{cache:false});return parseJSON(r.text)}
    catch(e){if(e&&e.code==="rate_limited"&&i<2){await sleep(2500*(i+1));continue}
      if(e&&e.name==="SyntaxError"&&i<1)continue;throw e}
  }
}
function errMsg(e){var c=e&&e.code;
  if(c==="rate_limited")return"Claude is busy right now (rate limit). Wait a few seconds, then retry.";
  if(c==="not_granted")return"Permission to ask Claude was declined. Allow it when prompted, then retry.";
  if(c==="unavailable")return"Claude isn’t available in this view. Open the artifact in claude.ai to use it.";
  return"Something went wrong getting a reply. Retry, or use a starter question below."}
function setBanner(e,fn){banner=errMsg(e);retryFn=fn;render()}

/* ---------- views ---------- */
function render(){var app=$("#app");
  if(view==="home")app.innerHTML=homeHTML();
  else if(view==="interview")app.innerHTML=interviewHTML();
  else app.innerHTML=reportHTML();
  bind();window.scrollTo({top:0})}
function bannerHTML(){return banner?'<div class="banner" role="alert"><span>'+esc(banner)+'</span><span class="row"><button class="btn small primary" data-a="retry">Retry</button><button class="btn small" data-a="dismiss">Dismiss</button></span></div>':""}

function homeHTML(){
  var h='<section class="hero"><div><h1>Can you defend every line you wrote?</h1><p class="lede">Upload your resume or any write-up of your work. We pull out each claim and question it the way a real interviewer would, using your own words. You’ll find the weak spots before they do.</p>'+
  '<div class="how"><div><span class="logo">1</span><span><b>We find your claims</b>Every achievement, number and title becomes something to defend.</span></div><div><span class="logo">2</span><span><b>You answer follow-ups</b>Each answer shapes the next question, getting more specific.</span></div><div><span class="logo">3</span><span><b>You get a Defense Report</b>See what holds up, what’s shaky, and how to fix it.</span></div></div></div>'+
  '<div class="card"><h2>Start a session</h2><div class="drop" id="drop"><p><b>Drop a file here</b><br><span class="muted">Text, Markdown, CSV, JSON or HTML. For PDF or Word, paste the text below.</span></p><button class="btn small" id="pick">Choose a file</button><input type="file" id="file" hidden accept=".txt,.md,.csv,.json,.html,.htm,text/*"></div>'+
  '<label for="doc">Or paste your experience</label><textarea id="doc" placeholder="Paste your resume, LinkedIn About, project write-up, performance review…">'+esc(docDraft)+'</textarea>'+
  '<div class="row" style="margin-top:6px"><button class="btn small" id="ex">Try an example</button><span class="muted" id="count"></span></div>'+
  '<label for="mode">Interviewer style</label><select id="mode"><option value="recruiter">Friendly recruiter screening</option><option value="skeptic">Skeptical hiring manager</option><option value="tech">Technical deep-dive</option><option value="exec">Executive leadership</option></select>'+
  '<label for="role">Role you’re interviewing for (optional)</label><input id="role" type="text" style="width:100%;border:2px solid var(--line);border-radius:14px;padding:9px 12px;background:var(--surface)" placeholder="e.g. Product design lead" value="'+esc(formOpts.role)+'">'+
  bannerHTML()+
  '<div style="margin-top:14px"><button class="btn primary" id="go"'+(busy?" disabled":"")+'>'+(busy?'Finding your claims…':'Find my claims')+'</button></div><p class="muted" style="margin-top:10px">Your sessions stay in this browser. Text you submit is sent to Claude to generate questions.</p></div></section>';
  h+='<section><h2>Past sessions</h2>';
  if(!store.sessions.length)h+='<div class="empty">No sessions yet. Your practice runs will appear here so you can track progress.</div>';
  else{h+='<div class="hist">';store.sessions.forEach(function(s){var sc=overall(s);h+='<div class="item"><span><b>'+esc(s.title)+'</b><br><span class="muted">'+new Date(s.created).toLocaleDateString()+' · '+s.claims.length+' claims · '+(sc==null?"not scored":sc+"% defended")+'</span></span><span class="row"><button class="btn small" data-open="'+s.id+'">Open</button><button class="btn small" data-del="'+s.id+'" aria-label="Delete session">Delete</button></span></div>'});h+='</div>'}
  return h+'</section>'}

function color(sc){return sc==null?"var(--line)":sc>=70?"var(--good)":sc>=40?"var(--mid)":"var(--bad)"}
function label(sc){return sc==null?"Not tested":sc>=70?"Well defended":sc>=40?"Getting there":"Shaky"}
function overall(s){var v=s.claims.filter(function(c){return c.score!=null});if(!v.length)return null;return Math.round(v.reduce(function(a,c){return a+c.score},0)/s.claims.length)}
function active(){return cur.claims.find(function(c){return c.id===cur.activeId})||cur.claims[0]}

function interviewHTML(){
  var c=active(),tested=cur.claims.filter(function(x){return x.score!=null}).length;
  var h='<div class="row" style="justify-content:space-between;margin-bottom:14px"><div><h2 style="margin:0">'+esc(cur.title)+'</h2><span class="muted">'+tested+' of '+cur.claims.length+' claims tested</span></div><button class="btn primary" data-a="report">See Defense Report</button></div><div class="layout"><div class="claims" role="tablist" aria-label="Your claims">';
  cur.claims.forEach(function(x){h+='<button class="cl'+(x.id===c.id?" on":"")+'" data-claim="'+x.id+'" role="tab"><span class="t">'+esc(x.text)+'</span><div class="bar"><i style="width:'+(x.score||0)+'%;background:'+color(x.score)+'"></i></div></button>'});
  h+='</div><div class="card"><span class="tag" style="color:'+color(c.score)+'">'+label(c.score)+(c.score!=null?" · "+c.score+"%":"")+'</span><h3 style="margin-top:10px">“'+esc(c.text)+'”</h3><p class="muted">What an interviewer may doubt: '+esc(c.why)+'</p>';
  c.rounds.forEach(function(r){
    h+='<div class="msg q">'+esc(r.q)+'</div><div class="msg a">'+esc(r.a)+'</div>'+
    '<div class="fb"><b>'+esc(r.fb.verdict)+'</b>'+(r.fb.strengths&&r.fb.strengths.length?'<ul>'+r.fb.strengths.map(function(s){return'<li>✓ '+esc(s)+'</li>'}).join("")+'</ul>':"")+(r.fb.gaps&&r.fb.gaps.length?'<ul>'+r.fb.gaps.map(function(s){return'<li>Missing: '+esc(s)+'</li>'}).join("")+'</ul>':"")+'<div><b>Try this:</b> '+esc(r.fb.coaching)+'</div></div>'});
  if(busy)h+='<div class="msg q"><span class="dots" aria-label="Thinking"><span></span><span></span><span></span></span></div>';
  h+=bannerHTML();
  if(c.pending&&!busy){
    h+='<div class="msg q">'+esc(c.pending)+'</div><label for="ans">Your answer</label><textarea id="ans" placeholder="Be specific: what did you personally do, how do you know it worked, what would you do differently?">'+esc(draft)+'</textarea><div class="row" style="margin-top:8px"><button class="btn primary" data-a="send">Send answer</button><button class="btn" data-a="skip">Skip this claim</button></div>'}
  else if(!c.pending&&!busy){
    var next=cur.claims.find(function(x){return x.score==null});
    h+='<div class="empty" style="margin-top:12px">'+(c.rounds.length?"You’ve finished this claim.":"This claim was skipped.")+' '+(next?'<br><button class="btn primary small" style="margin-top:10px" data-claim="'+next.id+'">Next untested claim</button>':'<br><button class="btn primary small" style="margin-top:10px" data-a="report">See your Defense Report</button>')+'</div>';
    if(!c.rounds.length)h+='<div class="row" style="margin-top:10px"><button class="btn small" data-a="reopen">Defend it anyway</button></div>'}
  return h+'</div></div>'}

function ring(p){var r=56,C=2*Math.PI*r,v=p==null?0:p;return'<svg class="ring" width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="Overall defense score '+(p==null?0:p)+' percent"><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="'+color(p)+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+(C*v/100)+' '+C+'" transform="rotate(-90 75 75)"/><text x="75" y="84" text-anchor="middle" font-size="32" fill="var(--ink)">'+(p==null?"–":p+"%")+'</text></svg>'}

function reportHTML(){
  var p=overall(cur),g={good:[],mid:[],bad:[],none:[]};
  cur.claims.forEach(function(c){(c.score==null?g.none:c.score>=70?g.good:c.score>=40?g.mid:g.bad).push(c)});
  var h='<div class="row" style="justify-content:space-between;margin-bottom:14px"><h2 style="margin:0">Defense Report</h2><span class="row"><button class="btn small" data-a="back">Back to interview</button><button class="btn small" data-a="exmd">Export Markdown</button><button class="btn small" data-a="exjson">Export JSON</button></span></div>'+
  '<div class="card stats">'+ring(p)+'<div><h3>'+(p==null?"Answer a few questions to see your score":p>=70?"You can defend most of what you claimed":p>=40?"A solid base, with some claims to firm up":"Several claims need stronger evidence")+'</h3><p class="muted">Score = average defense across all '+cur.claims.length+' claims. Untested claims count as zero, since an interviewer may ask about any of them.</p><span class="tag" style="color:var(--good)">'+g.good.length+' well defended</span> <span class="tag" style="color:var(--mid)">'+g.mid.length+' getting there</span> <span class="tag" style="color:var(--bad)">'+g.bad.length+' shaky</span> <span class="tag">'+g.none.length+' untested</span></div></div>'+bannerHTML();
  h+='<div class="card" style="margin-top:16px"><h3>Your game plan</h3>';
  if(cur.plan){h+='<p>'+esc(cur.plan.summary)+'</p><ol>'+(cur.plan.priorities||[]).map(function(x){return'<li>'+esc(x)+'</li>'}).join("")+'</ol><button class="btn small" data-a="plan"'+(busy?" disabled":"")+'>Refresh plan</button>'}
  else h+='<p class="muted">Get a short plan based on everything you answered: what to rehearse first and how to say it.</p><button class="btn primary small" data-a="plan"'+(busy?" disabled":"")+'>'+(busy?"Writing your plan…":"Write my game plan")+'</button>';
  h+='</div><h3 style="margin-top:22px">Claim by claim</h3><div class="grid2">';
  cur.claims.forEach(function(c){var last=c.rounds[c.rounds.length-1];
    h+='<div class="card"><span class="tag" style="color:'+color(c.score)+'">'+label(c.score)+(c.score!=null?" · "+c.score+"%":"")+'</span><p style="margin:10px 0 8px"><b>'+esc(c.text)+'</b></p><div class="bar" style="margin-bottom:10px"><i style="width:'+(c.score||0)+'%;background:'+color(c.score)+'"></i></div>'+
    (last?'<p class="muted" style="margin:0 0 6px">'+esc(last.fb.verdict)+'</p>'+(last.fb.gaps&&last.fb.gaps.length?'<p style="margin:0 0 6px"><b>Still missing:</b> '+esc(last.fb.gaps.join("; "))+'</p>':"")+'<p style="margin:0"><b>Strengthen it:</b> '+esc(last.fb.coaching)+'</p>':'<p class="muted" style="margin:0">Not tested yet. Expect a question here.</p>')+
    '<div style="margin-top:10px"><button class="btn small" data-claim="'+c.id+'" data-a="goto">'+(c.rounds.length?"Practice again":"Defend this")+'</button></div></div>'});
  return h+'</div>'}

/* ---------- actions ---------- */
function bind(){
  var drop=$("#drop");
  if(drop){
    ["dragenter","dragover"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("over")})});
    ["dragleave","drop"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("over")})});
    drop.addEventListener("drop",function(e){readFile(e.dataTransfer.files[0])});
    $("#pick").onclick=function(){$("#file").click()};$("#file").onchange=function(e){readFile(e.target.files[0])};
    var d=$("#doc"),upd=function(){docDraft=d.value;$("#count").textContent=d.value.length?d.value.length.toLocaleString()+" characters":""};d.oninput=upd;upd();
    $("#mode").value=formOpts.mode;$("#mode").onchange=function(){formOpts.mode=this.value};$("#role").oninput=function(){formOpts.role=this.value};
    $("#ex").onclick=function(){docDraft=EXAMPLE;render()};$("#go").onclick=startSession}
  var a=$("#ans");if(a)a.oninput=function(){draft=a.value};
  document.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){cur=store.sessions.find(function(s){return s.id===b.dataset.open});view="interview";banner=null;render()}});
  document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){if(confirm("Delete this session?")){store.sessions=store.sessions.filter(function(s){return s.id!==b.dataset.del});cur=null;try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}render()}}});
  document.querySelectorAll("[data-claim]").forEach(function(b){b.onclick=function(){cur.activeId=b.dataset.claim;draft="";view="interview";banner=null;save();render()}});
  document.querySelectorAll("[data-a]").forEach(function(b){b.addEventListener("click",function(){act(b.dataset.a)})})}
function act(a){
  if(a==="retry"&&retryFn){banner=null;retryFn()}
  else if(a==="dismiss"){banner=null;render()}
  else if(a==="send")sendAnswer();
  else if(a==="skip"){active().pending=null;draft="";save();render()}
  else if(a==="reopen"){var c=active();c.pending=c.firstQ;save();render()}
  else if(a==="report"){view="report";banner=null;render()}
  else if(a==="back"){view="interview";banner=null;render()}
  else if(a==="plan")makePlan();
  else if(a==="exmd")exportFile("defense-report.md",toMD(),"text/markdown");
  else if(a==="exjson")exportFile("defense-report.json",JSON.stringify(cur,null,2),"application/json")}
function readFile(f){if(!f)return;if(/\.(pdf|docx?|pptx?)$/i.test(f.name)){banner="PDF and Word files can’t be read here. Open the file, copy the text, and paste it below.";render();return}
  var r=new FileReader();r.onload=function(){docDraft=String(r.result).replace(/<[^>]+>/g," ").slice(0,30000);banner=null;render()};r.readAsText(f)}

async function startSession(){
  var text=($("#doc").value||"").trim();
  if(text.length<80){banner="Add a bit more first. Paste at least a few lines about your experience.";render();return}
  busy=true;banner=null;render();
  var run=async function(){
    busy=true;banner=null;render();
    try{
      var m=MODES[formOpts.mode];
      var r=await ask("You are "+m+".\nA candidate shared the document below"+(formOpts.role?" while preparing to interview for: "+formOpts.role:"")+". Extract the 6 to 10 most meaningful claims they will have to defend (achievements, numbers, ownership, leadership, skills, titles). Quote or faithfully restate each claim in under 25 words. For each, give: \"why\" = one sentence on what an interviewer would doubt or want proof of, and \"first_question\" = a specific opening question that references this person’s own details (names, numbers, projects) and is not generic.\nReturn ONLY JSON: {\"title\":\"short session title\",\"claims\":[{\"text\":\"\",\"why\":\"\",\"first_question\":\"\"}]}\n\nDOCUMENT:\n"+text.slice(0,14000));
      if(!r.claims||!r.claims.length)throw{code:"parse"};
      cur={id:"s"+Date.now(),created:Date.now(),title:r.title||"Practice session",mode:formOpts.mode,role:formOpts.role,doc:text,claims:r.claims.slice(0,10).map(function(c,i){return{id:"c"+i,text:c.text,why:c.why,firstQ:c.first_question,pending:c.first_question,score:null,rounds:[]}}),activeId:"c0"};
      cur.activeId="c0";save();view="interview";busy=false;draft="";render()
    }catch(e){busy=false;setBanner(e,run)}};
  run()}

async function sendAnswer(){
  var c=active(),ans=($("#ans")||{}).value;ans=(ans||"").trim();
  if(ans.length<10){banner="Write a few sentences so the feedback has something to work with.";render();return}
  var q=c.pending,go=async function(){
    busy=true;banner=null;render();
    try{
      var hist=c.rounds.map(function(r){return"Q: "+r.q+"\nA: "+r.a}).join("\n\n");
      var n=c.rounds.length+1;
      var r=await ask("You are "+mode()+". You are testing whether a candidate can defend one claim from their own resume.\nCLAIM: "+c.text+"\nWHY IT MAY BE DOUBTED: "+c.why+"\nRESUME CONTEXT:\n"+cur.doc.slice(0,5000)+"\n\nPREVIOUS EXCHANGE:\n"+(hist||"(none)")+"\n\nCURRENT QUESTION: "+q+"\nCANDIDATE ANSWER: "+ans+"\n\nJudge how well the claim is defended so far (0-100): specific personal ownership, concrete evidence or numbers, honesty about limits, clear story. Be fair and kind but do not inflate. This is answer "+n+" of at most 3. Return ONLY JSON: {\"score\":0,\"verdict\":\"one sentence\",\"strengths\":[\"max 2 short items\"],\"gaps\":[\"max 3 specific missing things\"],\"coaching\":\"one concrete way to say it stronger, using their own details\",\"next_question\":\"a sharper follow-up that builds on a specific thing they just said and targets the biggest gap, or null if score is 80 or higher\"}");
      var sc=Math.max(0,Math.min(100,Math.round(Number(r.score)||0)));
      c.rounds.push({q:q,a:ans,fb:{verdict:r.verdict||"",strengths:r.strengths||[],gaps:r.gaps||[],coaching:r.coaching||""}});
      c.score=sc;c.pending=(sc>=80||n>=3||!r.next_question)?null:r.next_question;
      draft="";busy=false;save();render()
    }catch(e){busy=false;setBanner(e,go)}};
  draft=ans;go()}

async function makePlan(){
  var go=async function(){
    busy=true;banner=null;render();
    try{
      var sum=cur.claims.map(function(c){var l=c.rounds[c.rounds.length-1];return"- "+c.text+" | score: "+(c.score==null?"untested":c.score)+(l?" | gaps: "+(l.fb.gaps||[]).join("; "):"")}).join("\n");
      var r=await ask("You are "+mode()+" coaching a candidate after a practice session. Here are their claims and results:\n"+sum+"\n\nReturn ONLY JSON: {\"summary\":\"2 warm, honest sentences\",\"priorities\":[\"4 to 5 concrete rehearsal actions, ordered by importance, each naming the specific claim and what evidence or story to prepare\"]}");
      cur.plan=r;busy=false;save();render()
    }catch(e){busy=false;setBanner(e,go)}};
  go()}

function toMD(){var p=overall(cur);var m="# Defense Report: "+cur.title+"\n\nOverall: "+(p==null?"not scored":p+"%")+" · "+new Date(cur.created).toLocaleDateString()+"\n\n";
  if(cur.plan)m+="## Game plan\n"+cur.plan.summary+"\n\n"+(cur.plan.priorities||[]).map(function(x,i){return(i+1)+". "+x}).join("\n")+"\n\n";
  m+="## Claims\n";cur.claims.forEach(function(c){var l=c.rounds[c.rounds.length-1];m+="\n### "+c.text+"\n- Status: "+label(c.score)+(c.score!=null?" ("+c.score+"%)":"")+"\n"+(l?"- Gaps: "+((l.fb.gaps||[]).join("; ")||"none")+"\n- Strengthen: "+l.fb.coaching+"\n":"")});return m}
async function exportFile(name,data,type){
  try{var d=await claude.use("downloads");if(!d)throw 0;await d.save({filename:name,data:data})}
  catch(e){try{await navigator.clipboard.writeText(data);banner="Downloads aren’t available here, so the export was copied to your clipboard instead."}catch(x){banner="Couldn’t save or copy the export. Try again from the claude.ai artifact view."}render()}}

$("#home").onclick=function(){view="home";banner=null;render()};
$("#newBtn").onclick=function(){cur=null;view="home";banner=null;docDraft="";render()};
$("#themeBtn").onclick=function(){var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);var n=dark?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("dye.theme",n)}catch(e){}};
render();
})();
</script>
